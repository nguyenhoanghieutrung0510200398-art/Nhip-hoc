<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5ef">
<meta name="description" content="Nhịp Học — không gian học tập cá nhân: kế hoạch, tập trung, lịch, thẻ nhớ và sổ tay kiến thức.">
<title>Nhịp Học — Không gian học tập</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Nhịp Học">
<style>
:root, [data-theme="dark"]{
  --bg:#13131b; --bg2:#17171f;
  --surface:#1e1f2c; --surface2:#262736; --surface3:#313244;
  --line:rgba(255,255,255,.08);
  --text:#f4f2fa; --muted:#a5a3ba; --faint:#6f6e84;
  --purple:#8b7bd8; --purple2:#a68cf0; --purple-dark:#6a4fc4;
  --purple-soft:rgba(139,123,216,.16);
  --green:#6fbf9f; --green-soft:rgba(111,191,159,.15);
  --amber:#d9a45b; --amber-soft:rgba(217,164,91,.15);
  --red:#e07a7a; --red-soft:rgba(224,122,122,.15);
  --blue:#7aa2e0; --blue-soft:rgba(122,162,224,.15);
  --radius:18px;
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --topbar:rgba(19,19,27,.88);
}
[data-theme="light"]{
  --bg:#f4f3f9; --bg2:#efedf6;
  --surface:#ffffff; --surface2:#f0eef7; --surface3:#e7e4f2;
  --line:#e6e2f1;
  --text:#26273a; --muted:#7c7a92; --faint:#a8a6bc;
  --purple:#7b5ad9; --purple2:#9a86ec; --purple-dark:#6745c4;
  --purple-soft:rgba(123,90,217,.12);
  --green:#3f9d82; --green-soft:rgba(63,157,130,.12);
  --amber:#b57e26; --amber-soft:rgba(181,126,38,.12);
  --red:#c65b5b; --red-soft:rgba(198,91,91,.12);
  --blue:#4f7ec2; --blue-soft:rgba(79,126,194,.12);
  --shadow:0 10px 28px rgba(46,42,80,.10);
  --topbar:rgba(244,243,249,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--purple-soft)}
/* ===== Sidebar ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:252px;z-index:40;
  background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 16px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px}
.brand-mark{width:42px;height:42px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--purple2),var(--purple-dark));
  display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)}
.brand b{font-size:20px;letter-spacing:-.02em;display:block;line-height:1.2}
.brand b i{font-style:normal;color:var(--purple2)}
.brand small{font-size:9.5px;letter-spacing:.22em;color:var(--muted);font-weight:700}
.nav-label{font-size:10.5px;letter-spacing:.18em;color:var(--faint);font-weight:800;padding:14px 12px 8px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 13px;border-radius:13px;color:var(--muted);font-weight:600;font-size:14.5px;margin-bottom:2px}
.nav-item .ico{font-size:18px;width:24px;text-align:center}
.nav-item .cnt{margin-left:auto;background:var(--surface3);border-radius:99px;
  font-size:11px;padding:1px 9px;font-weight:800;color:var(--muted)}
.nav-item.active{background:var(--purple-soft);color:var(--text)}
.nav-item.active .cnt{background:var(--purple);color:#fff}
.nav-item:hover{background:var(--surface2)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.side-row{display:flex;gap:8px;padding:0 4px 12px}
.mini-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--surface2);border-radius:11px;padding:9px 6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.mini-btn:hover{color:var(--text)}
.profile{display:flex;align-items:center;gap:11px;padding:10px 8px 2px}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--amber),var(--purple));
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.profile b{font-size:13.5px;display:block}
.profile small{color:var(--muted);font-size:11.5px}
/* ===== Main + topbar ===== */
.main{margin-left:252px;min-height:100vh;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:var(--topbar);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1120px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:12px}
.crumbs{font-size:13.5px;color:var(--muted)}
.crumbs b{color:var(--text);font-weight:700}
.crumbs span{margin:0 8px;color:var(--faint)}
.top-actions{margin-left:auto;display:flex;gap:9px;align-items:center}
.ticon{width:38px;height:38px;border-radius:12px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted)}
.ticon:hover{color:var(--text)}
.container{max-width:1120px;margin:0 auto;padding:26px 24px 110px}
.view{display:none}
.view.active{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ===== Page heading ===== */
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:800;margin-bottom:8px}
.page-title{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.025em;margin-bottom:8px}
.page-title .dot{color:var(--purple2)}
.page-desc{color:var(--muted);font-size:14.5px;margin-bottom:22px;max-width:640px}
.page-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.page-head .page-actions{margin-left:auto;display:flex;gap:10px}
/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:34px 32px;margin-bottom:20px;
  background:linear-gradient(120deg,#9a86ec 0%,#7b5ad9 55%,#6745c4 100%);color:#fff;box-shadow:var(--shadow)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(255,255,255,.22)}
.hero::before{width:340px;height:340px;right:-90px;top:-110px}
.hero::after{width:220px;height:220px;right:60px;bottom:-130px}
.hero-kicker{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.22em;
  font-weight:800;opacity:.85;margin-bottom:14px}
.hero-kicker::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.hero h2{font-size:clamp(30px,4.6vw,44px);font-weight:800;letter-spacing:-.03em;line-height:1.12;margin-bottom:12px;position:relative;z-index:1}
.hero p{opacity:.92;font-size:14.5px;max-width:420px;position:relative;z-index:1}
.hero .btn{margin-top:18px;position:relative;z-index:1}
.hero-art{position:absolute;right:34px;top:50%;transform:translateY(-50%);font-size:88px;opacity:.9;z-index:1;filter:drop-shadow(0 14px 22px rgba(0,0,0,.25))}
@media(max-width:640px){.hero-art{display:none}.hero{padding:26px 22px}}
/* ===== Cards & stats ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:22px;margin-bottom:18px}
.card h2{font-size:16.5px;margin-bottom:4px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;overflow:hidden}
.stat .k{font-size:12px;color:var(--muted);font-weight:600}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 2px}
.stat .v small{font-size:14px;font-weight:600;color:var(--muted)}
.stat .d{font-size:12px;color:var(--muted)}
.stat-icon{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.si-purple{background:var(--purple-soft);color:var(--purple2)}
.si-green{background:var(--green-soft);color:var(--green)}
.si-amber{background:var(--amber-soft);color:var(--amber)}
.si-blue{background:var(--blue-soft);color:var(--blue)}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:start}
@media(max-width:900px){.two{grid-template-columns:1fr}}
/* ===== Buttons / forms ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:13px;font-weight:700;font-size:14.5px;border:1px solid transparent}
.btn-primary{background:linear-gradient(135deg,var(--purple2),var(--purple-dark));color:#fff;
  box-shadow:0 6px 18px rgba(123,90,217,.4)}
.btn-primary:active{transform:scale(.98)}
.btn-white{background:#fff;color:var(--purple-dark)}
.btn-ghost{background:var(--surface2);color:var(--text)}
.btn-ghost:hover{background:var(--surface3)}
.btn-danger-ghost{background:var(--red-soft);color:var(--red)}
.btn-sm{padding:8px 14px;font-size:13px;border-radius:11px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.field{margin-bottom:13px}
.field>span{display:block;font-size:13px;font-weight:650;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:13px;background:var(--bg2);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--purple)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .wide{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
/* ===== Tasks ===== */
.task-list{border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:13px;padding:15px 6px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.check{width:25px;height:25px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:800;background:transparent}
.check.done{background:var(--green);border-color:var(--green)}
.task-body{flex:1;min-width:0}
.task-body strong{display:block;font-size:15px;font-weight:650}
.task-body.done strong{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;font-size:12.5px;color:var(--muted);align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}
.badge.medical{background:var(--purple-soft);color:var(--purple2)}
.badge.english{background:var(--green-soft);color:var(--green)}
.badge.other{background:var(--surface3);color:var(--muted)}
.badge.min{background:var(--amber-soft);color:var(--amber)}
.badge.goal{background:var(--blue-soft);color:var(--blue)}
.badge.over{background:var(--red-soft);color:var(--red)}
.icon-btn{width:36px;height:36px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface2);font-size:16px;flex-shrink:0;color:var(--muted)}
.icon-btn:hover{color:var(--text);background:var(--surface3)}
.icon-btn.sm{width:28px;height:28px;font-size:12.5px;background:transparent}
.group-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;
  letter-spacing:.1em;margin:22px 0 4px}
.empty{text-align:center;padding:36px 18px;color:var(--muted)}
.empty .big{font-size:36px;display:block;margin-bottom:10px}
/* ===== Plan chart ===== */
.stackbar{display:flex;height:22px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:10px 0}
.stackbar span{display:block;height:100%}
.prow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13.5px}
.prow .nm{width:78px;flex-shrink:0;font-weight:600}
.prow .barwrap{flex:1;height:10px;background:var(--surface2);border-radius:99px;position:relative;overflow:hidden}
.prow .barwrap i{position:absolute;top:0;bottom:0;border-radius:99px}
.prow .num{width:100px;text-align:right;color:var(--muted);font-size:12px;flex-shrink:0}
/* ===== Calendar ===== */
.seg{display:inline-flex;background:var(--surface2);border-radius:13px;padding:4px;gap:4px;margin-bottom:16px}
.segbtn{padding:9px 20px;border-radius:10px;font-weight:700;color:var(--muted);font-size:13.5px}
.segbtn.sel{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.cal-nav strong{font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:640px){.cal-grid{gap:4px}}
.day{border:1px solid var(--line);border-radius:14px;padding:9px 6px;min-height:104px;background:var(--bg2);cursor:pointer}
.day:hover{border-color:var(--purple)}
.day.sel{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-soft)}
.day.today .num{color:var(--purple2)}
.day .dow{font-size:10px;color:var(--muted);text-transform:uppercase;text-align:center;letter-spacing:.06em}
.day .num{font-size:17px;font-weight:800;text-align:center;margin:3px 0 7px}
.day .ev{font-size:10.5px;background:var(--purple-soft);color:var(--purple2);border-radius:7px;
  padding:3px 6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .ev.done{background:var(--green-soft);color:var(--green);text-decoration:line-through}
.day .ev.eng{background:var(--green-soft);color:var(--green)}
.day .more{font-size:10px;color:var(--muted);text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mgrid .dow{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
.mday{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--bg2);
  font-size:13.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.mday.blank{background:transparent;border:0}
.mday.today{border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-soft)}
.mday.sel{background:var(--purple);border-color:var(--purple);color:#fff}
.mday.sel .cnt{background:rgba(255,255,255,.25);color:#fff}
.mday .cnt{font-size:10px;background:var(--purple-soft);color:var(--purple2);border-radius:99px;padding:1px 8px}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.ygrid{grid-template-columns:repeat(2,1fr)}}
.mmini{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg2);text-align:left}
.mmini:hover{border-color:var(--purple)}
.mmini strong{font-size:13px;display:block;margin-bottom:8px}
.mmini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mmini-grid span{font-size:9.5px;text-align:center;color:var(--faint);aspect-ratio:1;
  display:flex;align-items:center;justify-content:center;border-radius:4px}
.mmini-grid span.has{background:var(--purple-soft);color:var(--purple2);font-weight:700}
.mmini-grid span.today{box-shadow:0 0 0 1.5px var(--purple)}
/* ===== Timer ===== */
.timer-card{text-align:center}
.timer-wrap{padding:8px 0}
.ring{width:min(64vw,240px);height:min(64vw,240px);margin:4px auto}
.ring .bg{fill:none;stroke:var(--surface3);stroke-width:11}
.ring .fg{fill:none;stroke:url(#tgrad);stroke-width:11;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .5s linear}
.timer-time{font-size:52px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px}
.timer-state{color:var(--muted);font-size:13.5px;margin:6px 0 4px}
.timer-state strong{color:var(--text)}
.dur-row{display:flex;gap:8px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.dur{padding:9px 18px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:13.5px;color:var(--muted)}
.dur.sel{background:var(--purple-soft);color:var(--purple2)}
body.tfull{overflow:hidden}
body.tfull .timer-wrap{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;padding:48px 16px}
body.tfull .ring{width:min(80vw,330px);height:min(80vw,330px)}
body.tfull .timer-time{font-size:68px}
/* ===== Charts ===== */
.bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;min-height:4px;
  background:linear-gradient(180deg,var(--purple2),var(--purple-dark))}
.bar.today{background:linear-gradient(180deg,#8fd8b8,var(--green))}
.bar-val{font-size:11px;font-weight:700;color:var(--muted)}
.bar-dow{font-size:11px;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.legend{font-size:13.5px}
.legend div{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.dot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.hcell{aspect-ratio:1;border-radius:5px;background:var(--surface2)}
.hcell.l1{background:#5b4b9e}.hcell.l2{background:#7b5fd0}.hcell.l3{background:#a68cf0}
.progress{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--purple-dark),var(--purple2));border-radius:99px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 2px;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .k small{display:block;font-size:11.5px}
.kv .v{font-weight:700;white-space:nowrap}
/* ===== Flashcards ===== */
.fc-layout{display:grid;grid-template-columns:264px 1fr;gap:16px;align-items:start}
@media(max-width:760px){.fc-layout{grid-template-columns:1fr}}
.fc-side{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.frow{display:flex;align-items:center;gap:4px;border-radius:11px;padding:5px 2px}
.frow.sel{background:var(--purple-soft)}
.frow-name{flex:1;text-align:left;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--muted)}
.frow.sel .frow-name{color:var(--text)}
.frow-name small{color:var(--faint);font-weight:400}
.frow-ops{display:flex;gap:2px;flex-shrink:0}
.fcard{border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px;background:var(--surface)}
.fcard .front{font-weight:700;margin-bottom:6px;font-size:15.5px}
.fcard .back{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fcard .meta{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tagchip{background:var(--purple-soft);color:var(--purple2);border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:700}
.study-full{position:fixed;inset:0;z-index:85;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px}
.study-card{width:100%;max-width:1080px;min-height:460px;background:var(--surface);border:1px solid var(--line);
  border-radius:22px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;
  padding:44px;text-align:center;cursor:pointer}
.study-card .q{font-size:26px;font-weight:700}
.study-card .a{font-size:20px;white-space:pre-line}
.study-card .hint{font-size:13px;color:var(--muted);margin-top:18px}
.study-prog{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:700}
/* ===== Thẻ nhớ: kho thẻ kiểu mẫu ===== */
.fctabs{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.fctab{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;
  font-weight:700;color:var(--muted);font-size:14px}
.fctab.sel{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.fctab:hover{background:var(--surface2)}
/* Panel ôn tập */
.review-panel{border:1px solid var(--line)}
.rp-top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.rp-left{display:flex;gap:16px;align-items:flex-start;min-width:0}
.rp-brain{font-size:40px;flex-shrink:0;filter:drop-shadow(0 4px 10px rgba(139,123,216,.4))}
.rp-kicker{font-size:10.5px;letter-spacing:.2em;color:var(--muted);font-weight:800;margin-bottom:6px}
.rp-title{font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.rp-right{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.rp-swap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.rp-swap span{cursor:help}
.rp-filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:640px){.rp-filters{grid-template-columns:1fr}}
.rp-filters .field{margin-bottom:0}
/* Sidebar kho thẻ */
.fc-side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.fc-side-head strong{font-size:14px}
.fc-crumb{font-size:11px;color:var(--faint);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-tags{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.fc-tags-title{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px}
.tagpills{display:flex;flex-wrap:wrap;gap:7px}
.tagpill{padding:6px 13px;border-radius:99px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.tagpill.sel{background:var(--purple);border-color:var(--purple);color:#fff}
/* Workspace */
.fc-search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:0 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.fc-search span{color:var(--muted)}
.fc-search input{flex:1;border:0;background:none;padding:14px 0;color:var(--text)}
.fc-search input:focus{outline:none}
.fc-listhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.fc-listhead h2{font-size:20px}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stab{padding:8px 16px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.stab small{opacity:.75;font-weight:600}
.stab.sel{background:var(--purple);color:#fff}
.stab:hover{background:var(--surface2)}
.icon-btn.sm.on{color:var(--amber)}
/* ===== Thẻ ghi nhớ: modal tạo thẻ ===== */
.ctabs{display:flex;gap:6px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.ctab{padding:9px 16px;border-radius:11px;font-weight:700;color:var(--muted);background:var(--surface2);font-size:13.5px}
.ctab.sel{background:var(--purple-soft);color:var(--purple2)}
#fc-preview-box{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.cloze-blank{display:inline-block;min-width:70px;text-align:center;background:var(--surface3);
  color:var(--muted);border-radius:7px;padding:0 12px;margin:0 2px;font-weight:700}
.cloze-show{background:var(--purple-soft);color:var(--purple2);border-radius:7px;padding:0 9px;font-weight:700}
.linkchip{display:inline-flex;align-items:center;gap:4px;background:var(--blue-soft);color:var(--blue);
  border-radius:99px;padding:2px 11px;font-size:12px;font-weight:700;margin:0 2px}
.imgprev{position:relative;display:inline-block;margin:0 10px 10px 0;vertical-align:top}
.imgprev img{max-height:110px;border-radius:12px;border:1px solid var(--line);display:block}
.imgprev button{position:absolute;top:-9px;right:-9px;width:26px;height:26px;border-radius:50%;
  background:var(--surface3);color:var(--text);font-size:12px;display:flex;align-items:center;justify-content:center}
.occl-canvas{width:100%;border-radius:12px;border:1px solid var(--line);touch-action:none;cursor:crosshair;background:#0c0c12}
.occl-view{position:relative;display:inline-block;max-width:100%}
.occl-view img{display:block;max-width:100%;border-radius:12px}
.occl-mask{position:absolute;background:rgba(22,17,44,.93);border:1.5px solid var(--purple2);border-radius:6px}
.tbadge{background:var(--surface3);color:var(--muted);border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700}
/* ===== Bổ sung từ nghiên cứu app hàng đầu ===== */
.grade-row{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.grade-btn{flex:1;min-width:110px;max-width:170px;padding:12px 8px;border-radius:14px;background:var(--surface2);
  font-weight:700;font-size:13.5px;display:flex;flex-direction:column;gap:3px;align-items:center}
.grade-btn small{font-weight:600;color:var(--muted);font-size:11px}
.grade-btn.g-again{background:var(--red-soft);color:var(--red)}
.grade-btn.g-hard{background:var(--amber-soft);color:var(--amber)}
.grade-btn.g-good{background:linear-gradient(135deg,var(--purple2),var(--purple-dark));color:#fff}
.grade-btn.g-good small{color:rgba(255,255,255,.85)}
.grade-btn.g-easy{background:var(--green-soft);color:var(--green)}
.study-tools{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.kbd-hint{font-size:11px;color:var(--faint);margin-top:10px;text-align:center}
.prio{display:inline-flex;align-items:center;font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px}
.prio.p1{background:var(--red-soft);color:var(--red)}
.prio.p2{background:var(--amber-soft);color:var(--amber)}
.prio.p3{background:var(--blue-soft);color:var(--blue)}
.prio.p4{background:var(--surface3);color:var(--muted)}
.pomo-dots{display:flex;gap:7px;justify-content:center;margin:10px 0}
.pomo-dots span{width:11px;height:11px;border-radius:50%;background:var(--surface3)}
.pomo-dots span.done{background:var(--green)}
.pomo-dots span.cur{background:var(--purple2);box-shadow:0 0 0 3px var(--purple-soft)}
.phase-label{font-size:12.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.habit-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.habit-cell{aspect-ratio:1;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--faint);border:1.5px solid transparent;font-weight:700}
.habit-cell.done{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.habit-cell.today{border-color:var(--purple)}
.habit-row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
.habit-row:last-child{border-bottom:0}
.habit-info{flex:1;min-width:0}
.habit-info b{font-size:15px}
.habit-info small{color:var(--muted);display:block;font-size:12px}
.fire{color:var(--amber);font-weight:800}
/* Phân tầng nhiệm vụ 4 cấp */
.tdepth-1{margin-left:20px}
.tdepth-2{margin-left:40px}
.tdepth-3{margin-left:60px}
.tdepth-4{margin-left:80px}
.lvlchip{font-size:10.5px;font-weight:800;color:var(--faint);border:1px solid var(--line);
  border-radius:99px;padding:1px 8px;white-space:nowrap}
@media(max-width:560px){.tdepth-2{margin-left:26px}.tdepth-3{margin-left:40px}.tdepth-4{margin-left:52px}}
/* Ô nhập tên 4 tầng */
.tname-grid{display:flex;flex-direction:column;gap:6px}
.tname-row{display:flex;align-items:center;gap:8px}
.tname-row .tn-ico{width:26px;text-align:center;flex-shrink:0;font-size:15px}
.tname-row input{flex:1;min-width:0}
.tname-row:nth-child(2){margin-left:16px}
.tname-row:nth-child(3){margin-left:32px}
.tname-row:nth-child(4){margin-left:48px}
/* ===== Lịch học kiểu mới ===== */
.calpage{padding:4px 2px 22px}
.cal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:8px 0 20px}
.cal-title{font-size:30px;font-weight:800;color:#f4f1fb;margin:6px 0 8px;letter-spacing:-.3px}
.cal-desc{color:#8f8b9f;font-size:13.5px;margin:0;max-width:520px}
.btn-schedule{background:#8b7bd8;color:#fff;border:none;border-radius:12px;padding:13px 24px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 6px 18px rgba(139,123,216,.35);margin-top:22px}
.btn-schedule:active{transform:scale(.97)}
.cal-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cal-navleft{display:flex;align-items:center;gap:10px}
.nbtn{width:34px;height:34px;border-radius:10px;border:1px solid #33314a;background:#1c1b26;color:#b9b4cc;font-size:18px;line-height:1;cursor:pointer}
.nrange{color:#9d8df1;font-weight:700;font-size:14px;white-space:nowrap}
.ntoday{border:1px solid #33314a;background:#1c1b26;color:#d9d5e8;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer}
.subfilter{display:flex;background:#e9e4f6;border-radius:13px;padding:4px;gap:2px}
.subfilter button{border:none;background:transparent;color:#6d6884;font-size:13px;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer}
.subfilter button.on{background:#2b2839;color:#fff}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);background:#262433;border:1px solid #262433;border-radius:18px;overflow:hidden}
.dcol{background:#17161f;padding:14px 10px 12px;min-height:320px;border-right:1px solid #262433;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.dcol:last-child{border-right:none}
.dcol .dow{font-size:10px;letter-spacing:1.5px;color:#7d7890;text-align:center;font-weight:700}
.dcol .dnum{font-size:30px;font-weight:800;color:#9d8df1;text-align:center;line-height:44px}
.dcol.sel{background:#fff}
.dcol.sel .dow{color:#8a86a0}
.dcol.sel .dnum{background:#9d8df1;color:#fff;width:44px;height:44px;border-radius:50%;margin:0 auto;font-size:23px;line-height:44px}
.dcol .dmin{font-size:10.5px;color:#6f6a84;text-align:center}
.dcol .dmin .dtgt{color:#9d8df1;cursor:pointer;border-bottom:1px dashed #9d8df1;font-weight:700}
.dcol.drover{background:#232130;outline:2px dashed #9d8df1;outline-offset:-6px}
.dcol.sel.drover{background:#f2eefc}
.devs{display:flex;flex-direction:column;gap:8px}
.ev{background:#e9e4f6;border-radius:10px;padding:8px 10px;cursor:grab}
.ev:active{cursor:grabbing}
.ev-top{font-size:10px;color:#8a86a0;margin-bottom:2px}
.ev-title{font-size:12.5px;font-weight:700;color:#2b2839;line-height:1.35;word-break:break-word}
.ev.done .ev-title{text-decoration:line-through;color:#8a86a0}
.evmore{font-size:11px;color:#9d8df1;text-align:center;cursor:pointer;font-weight:700}
.dadd{margin-top:auto;border:1.5px dashed #45425e;background:transparent;color:#7d7890;border-radius:10px;padding:10px;font-size:16px;cursor:pointer}
.dadd:hover{border-color:#9d8df1;color:#9d8df1}
.dcol.sel .dadd{border-color:#d5cfee;color:#a09bc0}
.cal-hint{display:flex;gap:8px;color:#8f8b9f;font-size:12.5px;margin:14px 2px;align-items:flex-start;line-height:1.5}
.dday{background:#17161f;border:1px solid #262433;border-radius:18px;padding:18px 18px 8px;margin-top:6px}
.dday-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dday-head strong{color:#f4f1fb;font-size:16px}
.dday-add{background:transparent;border:none;color:#9d8df1;font-weight:700;font-size:13.5px;cursor:pointer;padding:6px 2px}
.drow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid #262433}
.drow:last-child{border-bottom:none}
.drow-body{flex:1;min-width:0}
.drow-title{color:#f4f1fb;font-weight:600;font-size:14.5px;word-break:break-word}
.drow-title.done{color:#6f6a84;text-decoration:line-through}
.drow-meta{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.dsbadge{background:#e9e4f6;color:#5b5478;font-size:11.5px;font-weight:700;border-radius:8px;padding:3px 10px;display:inline-flex;align-items:center;gap:6px}
.dsbadge i{width:6px;height:6px;border-radius:50%;background:#9d8df1;display:inline-block}
.dtime{color:#8f8b9f;font-size:12px}
.playbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid #45425e;background:transparent;color:#d9d5e8;font-size:13px;cursor:pointer;flex-shrink:0}
.playbtn:hover{border-color:#9d8df1;color:#9d8df1}
.hidedate{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.cal-foot{display:flex;justify-content:space-between;color:#6f6a84;font-size:12px;margin:18px 4px 0;flex-wrap:wrap;gap:6px}
/* ===== Mục tiêu ===== */
.goal-info{display:flex;gap:10px;align-items:center;background:#1c1b26;border:1px solid #2b2940;color:#a09bc0;font-size:12.5px;border-radius:12px;padding:12px 16px;margin-bottom:16px;line-height:1.5}
.goal-card{background:#17161f;border:1px solid #262433;border-radius:18px;padding:6px 18px}
.gdiv{border-top:1px solid #262433;margin:4px -18px}
.grow{display:flex;align-items:center;gap:12px;padding:14px 0}
.gchev{background:none;border:none;color:#7d7890;font-size:16px;cursor:pointer;width:22px;flex-shrink:0;padding:0;transition:transform .15s;line-height:1}
.gchev.closed{transform:rotate(-90deg)}
.gicon{width:38px;height:38px;border-radius:11px;background:#e9e4f6;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.gmain{flex:1;min-width:0}
.gmain strong{display:block;color:#f4f1fb;font-size:14.5px;word-break:break-word}
.gmain small{color:#7d7890;font-size:11.5px}
.gside{width:120px;flex-shrink:0;text-align:right}
.gside small{color:#8f8b9f;font-size:11px}
.pbar{height:5px;border-radius:99px;background:rgba(233,228,246,.16);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:#cfc9e8}
.gchildren{border-left:1px solid #2e2c40;margin-left:11px;padding-left:22px}
.grow.leaf{padding:9px 0 9px 34px}
.gtitle{flex:1;color:#b9b4cc;font-size:13.5px;min-width:0;word-break:break-word}
.gtime{color:#6f6a84;font-size:11.5px;flex-shrink:0}
.gstat{font-size:10.5px;font-weight:800;border:1px solid var(--gsc,#8f8b9f);color:var(--gsc,#8f8b9f);border-radius:99px;padding:1px 9px;white-space:nowrap}
.gbadges{font-size:12px;letter-spacing:3px;white-space:nowrap}
.gdl{color:var(--muted);font-size:11px;white-space:nowrap}
.gmain[data-act],.gtitle[data-act]{cursor:pointer}
/* ===== Lộ trình ===== */
.rttabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.rttab{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 18px;font-weight:700;font-size:13.5px;cursor:pointer}
.rttab.on{background:var(--purple);border-color:var(--purple);color:#fff}
.rttab.add{border-style:dashed;color:var(--muted)}
.rt-alloc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rt-alloc label{font-size:12.5px;color:var(--muted);display:block}
.rt-alloc input{margin-top:4px}
.rt-warn{color:var(--amber);font-size:12.5px;margin:8px 0 0;font-weight:700}
.cmp-row{display:flex;align-items:center;gap:10px;margin:9px 0}
.cmp-row>span{width:140px;flex-shrink:0;font-size:12.5px;color:var(--muted)}
.cmp-bar{flex:1;height:10px;border-radius:99px;background:var(--surface3);overflow:hidden;min-width:60px}
.cmp-bar i{display:block;height:100%;border-radius:99px}
.cmp-bar i.need{background:#f7768e}
.cmp-bar i.have{background:#9ece6a}
.cmp-bar i.gross{background:#7aa2f7}
.cmp-row>b{width:64px;text-align:right;font-size:13px;flex-shrink:0}
.vd{font-size:13.5px;font-weight:700;margin:12px 0 4px;line-height:1.6}
.vd.ok{color:var(--green)}
.vd.warn{color:var(--amber)}
.vd.bad{color:var(--red)}
.rt-srow{display:flex;gap:10px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);font-size:13px}
.rt-srow strong{width:80px;flex-shrink:0}
.rt-srow span{flex:1;color:var(--muted)}
.rt-srow .ok{color:var(--green);font-weight:700;flex:0 0 auto}
.rt-srow .bad{color:var(--red);font-weight:700;flex:0 0 auto}
.rt-tablewrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.rt-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rt-table th,.rt-table td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.rt-table th:first-child,.rt-table td:first-child{text-align:left}
.rt-table th{position:sticky;top:0;background:var(--surface2);font-size:11.5px;color:var(--muted);z-index:1}
.rt-table tr.rv td{background:rgba(158,206,106,.07)}
@media(max-width:640px){.cmp-row>span{width:110px}.rt-alloc{grid-template-columns:1fr 1fr}}
/* ===== Thời khóa biểu ===== */
.tkb-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.tkb-grid{display:grid;grid-template-columns:52px repeat(7,minmax(128px,1fr));min-width:980px}
.tkb-corner{border-bottom:1px solid var(--line)}
.tkb-dhead{padding:10px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.tkb-dhead.today{background:var(--purple-soft)}
.tkb-dow{font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:700}
.tkb-dnum{font-size:16px;font-weight:800;margin:2px 0 6px}
.daymode{font-size:11px;max-width:100%;padding:4px 6px;border-radius:8px}
.tkb-gutter{border-right:1px solid var(--line)}
.tkb-hr{font-size:10px;color:var(--faint);text-align:right;padding:3px 8px 0 0;box-sizing:border-box}
.tkb-day{position:relative;border-left:1px solid var(--line);
  background:repeating-linear-gradient(to bottom,transparent 0 45px,rgba(140,140,160,.13) 45px 46px)}
.tkb-day.drover{background:rgba(139,123,216,.14)}
.slot-ghost{position:absolute;left:5px;right:5px;border:1.5px dashed var(--purple);border-radius:10px;
  background:rgba(139,123,216,.08);padding:6px 30px 6px 8px;overflow:hidden}
.sg-top{font-size:11px;font-weight:700;color:var(--purple2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-sug{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-add{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:8px;border:1px solid var(--purple);
  background:var(--surface);color:var(--purple2);font-size:14px;cursor:pointer;line-height:1}
.tev{position:absolute;left:5px;right:5px;border-radius:10px;padding:6px 8px;overflow:hidden;cursor:grab;
  background:color-mix(in srgb,var(--evc) 20%,transparent);border:1px solid var(--evc);border-left-width:4px}
.tev:active{cursor:grabbing}
.tev-time{font-size:10px;color:var(--muted);font-weight:700}
.tev-title{font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tev-tasks{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sugchip{font-size:11px;background:var(--purple-soft);color:var(--purple2);border-radius:99px;padding:2px 10px;font-weight:700}

.em-tasks label{font-size:13px;display:flex;gap:8px;align-items:center}

.sess-t{font-weight:700;font-size:13.5px}

.sess-meta{font-size:12px;color:var(--muted);line-height:1.6}
.sess-meta .ok{color:var(--green);font-weight:700}
.sess-meta .bad{color:var(--amber);font-weight:700}
.sess-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.sess-sum>div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.sess-sum span{display:block;font-size:10.5px;color:var(--muted)}

/* ===== Chỉ số học tập ===== */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}

@media(max-width:600px){.mgrid{grid-template-columns:1fr}}
.mcard{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px}
.mhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.mico{font-size:22px;line-height:1.2}
.mname{font-weight:800;font-size:14px}
.mmean{font-size:11px;color:var(--muted);font-style:italic;margin-top:2px}
.mnum{font-size:26px;font-weight:800}
.mnum small{font-size:12px;color:var(--muted);font-weight:600}
.msub{font-size:12px;color:var(--muted);margin-top:4px}
.mtrend{font-size:12px;margin-top:6px;font-weight:700;line-height:1.5}
.mtrend.up{color:var(--green)}
.mtrend.down{color:var(--amber)}

.mbar{flex:1;height:8px;border-radius:99px;background:var(--surface3);position:relative}
.mbar i{display:block;height:100%;border-radius:99px;background:var(--purple)}
.mbar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.7;border-radius:2px}
.mbar-row>b{min-width:70px;text-align:right;flex-shrink:0}
.mbar-row>b small{display:block;font-size:10px;color:var(--faint);font-weight:400}
.mlist{font-size:12.5px;display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mlist-row{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.mlist-row span{color:var(--muted);font-size:11px;flex-shrink:0}
.mlist-row b{flex-shrink:0}
.mlist-row small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mfoot{font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.mfoot.dim{color:var(--faint)}
.mempty{font-size:12.5px;color:var(--faint);text-align:center;padding:14px 6px;line-height:1.7}
.mwarn{font-size:12px;color:var(--amber);font-weight:700;margin-top:8px;line-height:1.5}
.mok{font-size:12px;color:var(--green);font-weight:700;margin-top:8px;line-height:1.5}

.fcard{cursor:pointer}
.fcard:hover{border-color:var(--purple)}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.pgbtn{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  color:var(--text);font-weight:700;font-size:13px;cursor:pointer;padding:0 10px}
.pgbtn.on{background:var(--purple);border-color:var(--purple);color:#fff}
.pgbtn:disabled{opacity:.35;cursor:default}
.pgdots{color:var(--faint)}
.pgtotal{font-size:12px;color:var(--muted);margin-left:6px}
.fp-faces{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:640px){.fp-faces{grid-template-columns:1fr}}
.fp-face{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:120px}
.fp-label{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
.fp-body{font-size:15px;line-height:1.7}
.fp-body img{max-width:100%;border-radius:10px}

.msel{position:relative}
.msel-btn{width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;color:var(--text);font-size:13.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msel-btn::after{content:"▾";float:right;color:var(--muted);margin-left:8px}

@media(max-width:640px){
  .gside{width:86px}
  .gchildren{margin-left:8px;padding-left:14px}
  .grow.leaf{padding-left:22px}
}
@media(max-width:900px){
  .cal7{display:flex;overflow-x:auto}
  .dcol{min-width:158px;border-right:1px solid #262433}

/* ===== Modal / toast / misc ===== */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--surface3);color:var(--text);padding:13px 22px;border-radius:15px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);transition:all .3s;z-index:120;max-width:90vw;text-align:center;pointer-events:none;
  border:1px solid var(--line)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-back{position:fixed;inset:0;background:rgba(8,8,14,.6);z-index:100;display:flex;
  align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}

.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:540px;
  max-height:88vh;overflow:auto;padding:24px;animation:up .25s ease;box-shadow:var(--shadow)}

@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin-bottom:14px;font-size:17px}
.footer{max-width:1120px;margin:0 auto;padding:0 24px 40px;color:var(--faint);font-size:12.5px;text-align:center}

.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--topbar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);

  .main{margin-left:0}
  .bottomnav{display:flex}
  .container{padding:20px 16px 120px}
  .topbar-inner{padding:12px 16px}

<script>
"use strict";
/* ============ TIỆN ÍCH ============ */
var SUBJECTS = ["Nội trú", "Tiếng Anh", "Khác"];
var LEVELS = ["Tối thiểu", "Mục tiêu", "Mở rộng"];
var TASK_LEVEL_NAMES = ["Mục lớn nhất","Mục lớn","Mục nhỏ","Mục nhỏ hơn"];
var TASK_LEVEL_ICONS = ["🎯","📌","📝","🔹"];
var VIEW_NAMES = {plan:"Kế hoạch", goals:"Mục tiêu", lotrinh:"Lộ trình", tkb:"Thời khóa biểu", cal:"Lịch", timer:"Bấm giờ", stats:"Hiệu suất", habits:"Thói quen", cards:"Thẻ nhớ"};
function $(s, r){ return (r||document).querySelector(s); }
function $all(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8); }
function pad(n){ return (n<10?"0":"")+n; }
function vnToday(d){
  var x = d ? new Date(d) : new Date();
  return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"}).format(x);
}
function addDaysStr(s, n){
  var d = new Date(s + "T12:00:00+07:00"); d.setDate(d.getDate()+n); return vnToday(d);
}
function fmtDate(s){
  if(!s) return "—";
  return new Date(s + "T12:00:00+07:00").toLocaleDateString("vi-VN",{weekday:"short",day:"2-digit",month:"2-digit"});
}
function fmtMin(n){
  n = Math.round(n||0);
  if(n >= 60){ var h = Math.floor(n/60), m = n%60; return h + "h" + (m ? " " + m + "p" : ""); }
  return n + " phút";
}
function subjectBadge(s){
  var c = s==="Tiếng Anh" ? "english" : (s==="Khác" ? "other" : "medical");
  return '<span class="badge '+c+'">'+esc(s||"Nội trú")+"</span>";
}
var toastTimer = null;
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 3200);
}

/* ============ KHO DỮ LIỆU ============ */
// Separate repositories on the same username.github.io origin.
var NH_SCOPE = location.protocol === 'file:' ? 'file:' : new URL('./',location.href).pathname;
var LS_KEY = NH_SCOPE === 'file:' ? 'nhiphoc-mini-v1' : 'nhiphoc-mini-v1:' + NH_SCOPE;
var store = { tasks:[], sessions:[], folders:[], cards:[], habits:[], fcSessions:[], settings:{ weeklyHours:15, theme:"dark" }, timer:null };
function loadStore(){
  var d = {};
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(raw){ var pd = JSON.parse(raw); if(pd && typeof pd==="object") d = pd; }
  }catch(e){}
  store.tasks = d.tasks||[]; store.sessions = d.sessions||[];
  store.folders = d.folders||[]; store.cards = d.cards||[];
  store.cards.forEach(function(c){ delete c.suspended; });
  store.habits = d.habits||[];
  store.fcSessions = d.fcSessions||[];
  store.plan = (d.plan && d.plan.scenarios && d.plan.scenarios.length) ? d.plan : {scenarios:defaultScenarios(), active:"sc-normal"};
  store.events = d.events||[];
  store.slots = d.slots||[];
  store.dayModes = d.dayModes||{};
  store.settings = Object.assign({weeklyHours:15, theme:"dark", examDate:"2027-07-07", newPerDay:20, swapStd:false, pomo:{focus:25,short:5,long:15,rounds:4}}, d.settings||{});
  store.timer = d.timer||null;
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){
    toast("Bộ nhớ trình duyệt đầy — hãy xuất JSON sao lưu rồi xóa bớt.");
  }
}
function saveStoreOK(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); return true; }catch(e){ return false; }
}
function fmtSize(b){ if(!(b>0)) return "0 B"; if(b<1024) return b+" B"; if(b<1048576) return (Math.round(b/102.4)/10)+" KB"; return (Math.round(b/104857.6)/10)+" MB"; }
function addTask(data){
  var t = Object.assign({ id:uid(), title:"", subject:"Nội trú", date:vnToday(),
    minutes:25, level:"Mục tiêu", done:false, prio:4, recur:"", parentId:"",
    outcome:"", deadline:"", reason:"", estMinutes:0, doneWhen:"", gstatus:"", note:"",
    createdAt:Date.now() }, data||{});
  t.files = (data&&data.files) ? data.files.slice() : [];
  t.checks = (data&&data.checks) ? data.checks.slice() : [];
  store.tasks.push(t); saveStore(); return t;
}
function getTask(id){ for(var i=0;i<store.tasks.length;i++) if(store.tasks[i].id===id) return store.tasks[i]; return null; }
function delTask(id){ store.tasks = store.tasks.filter(function(t){return t.id!==id;}); saveStore(); }
function addSession(data){
  var s = Object.assign({ id:uid(), title:"Phiên học", subject:"Nội trú", date:vnToday(),
    minutes:25, startedAt:Date.now(), topic:"", taskId:"", planned:0, mode:"manual",
    pauses:0, distractions:0, interruption:"", endedAt:0 }, data||{});
  store.sessions.push(s); saveStore(); return s;
}
function delSession(id){ store.sessions = store.sessions.filter(function(s){return s.id!==id;}); saveStore(); }

/* ============ GIAO DIỆN SÁNG / TỐI ============ */
function applyTheme(){
  var th = store.settings.theme || "dark";
  document.documentElement.setAttribute("data-theme", th);
  var ic = th==="dark" ? "🌙" : "☀️";
  var b1 = $("#theme-btn"), b2 = $("#theme-btn2");
  if(b1) b1.innerHTML = ic + " Giao diện";
  if(b2) b2.textContent = ic;
}
function toggleTheme(){
  store.settings.theme = (store.settings.theme==="dark") ? "light" : "dark";
  saveStore(); applyTheme();
}

/* ============ ĐIỀU HƯỚNG ============ */
var currentView = "plan";
function go(view){
  currentView = view;
  $all("#side-nav .nav-item").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-view")===view); });
  $all("#bottomnav .bnav-item").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-view")===view); });
  $all(".view").forEach(function(s){ s.classList.toggle("active", s.id==="view-"+view); });
  $("#crumb-now").textContent = VIEW_NAMES[view] || view;
  var cc = $("#nav-card-count");
  if(cc) cc.textContent = store.cards.length || "";
  render();
  window.scrollTo(0,0);
}
/* Kéo-thả chip việc giữa các cột ngày trong lịch tuần */
document.addEventListener("dragstart", function(e){
  var c = e.target.closest ? e.target.closest(".ev[draggable]") : null;
  if(c){ dragTaskId = c.getAttribute("data-id"); e.dataTransfer.effectAllowed = "move";
    try{ e.dataTransfer.setData("text/plain", dragTaskId); }catch(_){} }
});
document.addEventListener("dragover", function(e){
  var col = e.target.closest ? e.target.closest(".dcol") : null;
  if(col && dragTaskId){ e.preventDefault(); col.classList.add("drover"); }
});
document.addEventListener("dragleave", function(e){
  var col = e.target.closest ? e.target.closest(".dcol") : null;
  if(col) col.classList.remove("drover");
});
document.addEventListener("drop", function(e){
  var col = e.target.closest ? e.target.closest(".dcol") : null;
  if(col && dragTaskId){
    e.preventDefault();
    var t = getTask(dragTaskId);
    if(t && t.date !== col.getAttribute("data-d")){
      t.date = col.getAttribute("data-d"); saveStore();
      toast("Đã chuyển sang "+fmtDate(t.date)+".");
    }
    dragTaskId = null; render();
  }
});
document.addEventListener("dragend", function(){
  dragTaskId = null;
  document.querySelectorAll(".dcol.drover").forEach(function(x){ x.classList.remove("drover"); });
});
document.addEventListener("click", function(e){
  var nv = e.target.closest("[data-view]");
  if(nv && (nv.classList.contains("nav-item") || nv.classList.contains("bnav-item"))){ go(nv.getAttribute("data-view")); return; }
  var el = e.target.closest("[data-act]"); if(!el){
    var _mds = $all(".msel-drop.open");
    if(_mds.length && !e.target.closest(".msel")) _mds.forEach(function(d){ d.classList.remove("open"); });
    return;
  }
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  if(act==="toggle"){ var t=getTask(id); if(t){ t.done=!t.done;
    if(t.done){ t.gstatus="done"; } else if(t.gstatus==="done"){ t.gstatus="doing"; }
    if(t.done && t.recur){
      var nd = recurClone(t);
      toast("Đã tạo kỳ tiếp theo ("+fmtDate(nd)+").");
    }
    saveStore(); render(); } }
  else if(act==="t-collapse"){ taskCollapsed[id]=!taskCollapsed[id]; render(); }
  else if(act==="move-tomorrow"){
    var _mt=getTask(id);
    if(_mt){
      var _tom=addDaysStr(vnToday(),1), _dl=diffDays(_mt.date||vnToday(),_tom);
      (function _mv(x){ x.date=addDaysStr(x.date||vnToday(),_dl); x.moved=(x.moved||0)+1; taskChildren(x.id).forEach(_mv); })(_mt);
      saveStore(); render(); toast("Đã dời sang "+fmtDate(_tom)+".");
    }
  }
  else if(act==="hb-toggle"){
    var _hb = store.habits.find(function(x){return x.id===id;});
    if(_hb){ _hb.checks = _hb.checks||{}; var _dd = el.getAttribute("data-d");
      if(_hb.checks[_dd]) delete _hb.checks[_dd]; else _hb.checks[_dd] = true;
      saveStore(); render(); }
  }
  else if(act==="hb-del"){
    if(confirm("Xóa thói quen này?")){ store.habits = store.habits.filter(function(x){return x.id!==id;}); saveStore(); render(); }
  }
  else if(act==="del-task"){
    var _dt=getTask(id);
    if(_dt){
      var _kc=taskProgress(_dt.id).total;
      if(confirm("Xóa việc này"+(_kc? " và "+_kc+" mục con bên trong":"")+"?")){ delTaskTree(id); render(); }
    }
  }
  else if(act==="start-timer"){ presetTimer(id); go("timer"); }
  else if(act==="del-session"){ if(confirm("Xóa phiên học này?")){ delSession(id); render(); } }
  else if(act==="edit-session"){ sessionEditModal(id); }
  else if(act==="finish-now"){ finishTimer(); }
  else if(act==="calprev"){ calOffset--; render(); }
  else if(act==="calnext"){ calOffset++; render(); }
  else if(act==="caltoday"){ calOffset=0; calSel=vnToday(); render(); }
  else if(act==="caladd"){ planDatePreset = el.getAttribute("data-d")||calSel; go("plan"); setTimeout(function(){ var f=$("#f-n1"); if(f) f.focus(); },80); }
  else if(act==="calday"){ calSel = el.getAttribute("data-d"); render(); }
  else if(act==="calsub"){ calSubject = el.getAttribute("data-v"); render(); }
  else if(act==="set-target"){ var _ct=store.settings.dailyTargetMin||360; var _nv=prompt("Mục tiêu học mỗi ngày (phút):", _ct); if(_nv!==null){ _nv=parseInt(_nv,10); if(_nv>0&&_nv<=1440){ store.settings.dailyTargetMin=_nv; saveStore(); render(); } } }
  else if(act==="task-date"){ var _di=document.querySelector('.hidedate[data-tid="'+id+'"]'); if(_di){ if(_di.showPicker) _di.showPicker(); else _di.focus(); } }
  else if(act==="goplan"){ planDatePreset=null; go("plan"); setTimeout(function(){ var f=$("#f-n1"); if(f) f.focus(); },80); }
  else if(act==="goalsub"){ goalSubject = el.getAttribute("data-v"); render(); }
  else if(act==="goal-detail"){ goalDetailModal(id); }
  else if(act==="g-filedel"){ var _tf=getTask(id); if(_tf){ _tf.files=(_tf.files||[]).filter(function(f){return f.id!==el.getAttribute("data-f");}); saveStore(); var _fb=$("#gd-files"); if(_fb) _fb.innerHTML=goalFilesHTML(_tf); render(); } }
  else if(act==="g-checkadd"){ var _tc=getTask(id); if(_tc){ var _cd=$("#gd-cdate"), _ct=$("#gd-ctext"); var _tx=_ct?_ct.value.trim():"";
      if(_tx){ _tc.checks=_tc.checks||[]; _tc.checks.unshift({id:uid(), date:_cd?_cd.value:"", text:_tx}); saveStore();

function taskLevel(t){

  while(p&&g<8){ lv++; p=p.parentId?getTask(p.parentId):null; g++; }
  return Math.min(lv,4);

function taskChildren(id){ return store.tasks.filter(function(t){return t.parentId===id;}); }
function taskProgress(id){
  var all=[];
  (function walk(pid){ taskChildren(pid).forEach(function(c){ all.push(c); walk(c.id); }); })(id);
  var dn=all.filter(function(c){return c.done;}).length;
  return {done:dn,total:all.length};
}
function flatTaskTree(list){
  var inList={}; list.forEach(function(t){inList[t.id]=1;});
  var out=[];
  (function walk(pid, depth){
    list.filter(function(t){ return pid? (t.parentId===pid) : !(t.parentId&&inList[t.parentId]); })
      .sort(byPrio).forEach(function(t){
        out.push({t:t,depth:depth});
        if(!taskCollapsed[t.id]) walk(t.id,depth+1);
      });
  })("",0);
  return out;
}

function buildTaskChain(names, attrs){
  var d = -1, i;
  for(i=0;i<4;i++) if(names[i]) d = i;
  if(d<0) return null;
  for(var j=0;j<d;j++) if(!names[j]) return "gap";
  var pid = "";
  for(i=0;i<d;i++){
    var ex = null, key = names[i].trim().toLowerCase();
    for(var k=0;k<store.tasks.length;k++){ var _t=store.tasks[k];
      if(!_t.done && (_t.parentId||"")===(pid||"") && taskLevel(_t)===i+1
         && _t.title.trim().toLowerCase()===key){ ex=_t; break; } }
    if(ex){ pid = ex.id; }
    else {
      var anc = addTask({ title:names[i], parentId:pid, subject:attrs.subject, date:attrs.date,
        minutes:25, level:"Mục tiêu", prio:4, recur:"" });
      pid = anc.id;
    }
  }
  return addTask({ title:names[d], parentId:pid, subject:attrs.subject, date:attrs.date,
    minutes:attrs.minutes, level:attrs.level, prio:attrs.prio, recur:attrs.recur });
}
function diffDays(a,b){

  var base = t.date||vnToday();
  var nd = t.recur==="daily" ? addDaysStr(base,1) : addDaysStr(base,7);

  (function clone(src, newPid){
    var nid = uid();
    store.tasks.push({ id:nid, title:src.title, subject:src.subject,
      date: src.date? addDaysStr(src.date, diff) : "",
      deadline: src.deadline? addDaysStr(src.deadline, diff) : "",
      minutes:src.minutes, level:src.level, prio:src.prio||4, recur:src.recur,
      outcome:src.outcome||"", reason:src.reason||"", doneWhen:src.doneWhen||"",
      estMinutes:src.estMinutes||0, note:src.note||"", files:[], checks:[],
      parentId:newPid||"", done:false, createdAt:Date.now() });
    taskChildren(src.id).forEach(function(ch){ clone(ch, nid); });
  })(t, t.parentId||"");

var goalSubject = "Tất cả", goalChainPreset = null;
function goalRoots(){
  var open = store.tasks.filter(function(t){ return !t.done; });
  var inOpen = {}; open.forEach(function(t){ inOpen[t.id]=1; });
  return open.filter(function(t){ return !(t.parentId && inOpen[t.parentId]); }).sort(byPrio);
}
function goalOpenKids(id){ return store.tasks.filter(function(t){ return t.parentId===id && !t.done; }).sort(byPrio); }
function goalLeaves(id){
  var out = [];
  (function walk(pid){
    var ks = taskChildren(pid);
    if(!ks.length){ var t=getTask(pid); if(t) out.push(t); }
    else ks.forEach(function(c){ walk(c.id); });
  })(id);
  return out;
}
function goalStatus(t){
  var ls = goalLeaves(t.id);
  var dn = ls.filter(function(x){ return x.done; }).length;
  if(!ls.length) return {txt:"Chưa có việc", done:0, total:0};
  if(dn===ls.length) return {txt:"Hoàn thành", done:dn, total:ls.length};
  if(dn===0) return {txt:"Chưa học", done:0, total:ls.length};
  return {txt:"Đang học", done:dn, total:ls.length};
}

function goalAttachFiles(taskId, fl){
  var t = getTask(taskId); if(!t||!fl||!fl.length) return;
  var files = Array.prototype.slice.call(fl);
  (function next(i){
    if(i>=files.length){ render(); return; }
    var f = files[i];
    if(f.size > 3*1024*1024){ toast("“"+f.name+"” vượt quá 3MB — bỏ qua."); next(i+1); return; }
    var r = new FileReader();
    r.onload = function(){
      t.files = t.files||[];
      t.files.push({id:uid(), name:f.name, size:f.size, dataUrl:r.result});
      if(!saveStoreOK()){ t.files.pop(); toast("Bộ nhớ đầy — không đính kèm được “"+f.name+"”."); }
      var box = $("#gd-files"); if(box) box.innerHTML = goalFilesHTML(t);
      next(i+1);
    };
    r.onerror = function(){ toast("Không đọc được “"+f.name+"”."); next(i+1); };
    r.readAsDataURL(f);
  })(0);
}

var EXAM_PRESETS = [
  {id:"vstep", name:"VSTEP B1", date:"2026-12-26"},
  {id:"noitru", name:"Bác sĩ Nội trú", date:"2027-07-07"},
  {id:"custom", name:"Tùy chỉnh...", date:""}
];
function defaultScenarios(){
  return [
    {id:"sc-normal", name:"🐢 Thông thường", examId:"noitru", examDate:"",
     dailyMin:180, daysPerWeek:6, bufferPct:20, alloc:{"Nội trú":60,"Tiếng Anh":30,"Khác":10}},
    {id:"sc-fast", name:"🚀 Tăng tốc", examId:"noitru", examDate:"",
     dailyMin:300, daysPerWeek:7, bufferPct:10, alloc:{"Nội trú":60,"Tiếng Anh":30,"Khác":10}},
    {id:"sc-light", name:"🍃 Giảm tải", examId:"noitru", examDate:"",
     dailyMin:90, daysPerWeek:5, bufferPct:25, alloc:{"Nội trú":50,"Tiếng Anh":30,"Khác":20}}
  ];
}
function activeSc(){
  var p = store.plan || (store.plan = {scenarios:defaultScenarios(), active:"sc-normal"});
  var s = null;
  p.scenarios.forEach(function(x){ if(x.id===p.active) s=x; });
  if(!s){ s=p.scenarios[0]; p.active=s.id; }
  return s;
}
function scenExam(sc){
  if(sc.examId==="custom") return {name:"Ngày tùy chỉnh", date:sc.examDate||""};
  for(var i=0;i<EXAM_PRESETS.length;i++) if(EXAM_PRESETS[i].id===sc.examId) return EXAM_PRESETS[i];
  return EXAM_PRESETS[1];
}
/* Tổng khối lượng còn lại: cộng dồn việc lá chưa xong (ưu tiên thời gian dự kiến) */
function planWorkload(){
  var per={"Nội trú":0,"Tiếng Anh":0,"Khác":0}, leaves=0;
  goalRoots().forEach(function(r){
    goalLeaves(r.id).forEach(function(lf){
      if(lf.done) return;
      leaves++;
      var m = lf.estMinutes>0 ? lf.estMinutes : (lf.minutes||0);
      var s = lf.subject||"Nội trú"; if(!(s in per)) s="Khác";
      per[s]+=m;
    });
  });
  return {per:per, leaves:leaves, total:per["Nội trú"]+per["Tiếng Anh"]+per["Khác"]};
}
/* Thời gian thực sự có: tính ngược từ ngày thi */
function planCapacity(sc){
  var ex = scenExam(sc), today = vnToday();
  var dl = ex.date ? Math.max(0, diffDays(today, ex.date)) : 0;
  var sd = dl * (sc.daysPerWeek/7);
  var gross = Math.round(sd * sc.dailyMin);
  var buf = Math.round(gross * sc.bufferPct/100);
  return {exam:ex, daysLeft:dl, studyDays:sd, gross:gross, buffer:buf, net:gross-buf};
}
function planVerdict(wl, cap, sc){
  if(!cap.exam.date) return {cls:"warn", short:"Chưa có ngày thi", txt:"Hãy chọn ngày thi cho kịch bản này."};
  if(cap.daysLeft<=0) return {cls:"warn", short:"Đã qua ngày thi", txt:"Ngày thi đã qua hoặc là hôm nay — hãy chọn ngày thi khác."};
  if(wl.total<=0) return {cls:"ok", short:"Không tồn đọng", txt:"🎉 Không còn việc tồn đọng — dùng thời gian này để ôn sâu và thi thử."};
  if(wl.total<=cap.net) return {cls:"ok", short:"Vừa sức", txt:"✅ Vừa sức — trừ "+sc.bufferPct+"% dự phòng (ôn tập · thi thử · phát sinh) vẫn dư "+fmtDayMin(cap.net-wl.total)+"."};
  if(wl.total<=cap.gross) return {cls:"warn", short:"Vừa khít", txt:"⚠️ Vừa khít — phải dùng lấn vào "+sc.bufferPct+"% dự phòng mới đủ. Cân nhắc tăng tốc hoặc giảm tải."};
  var pd = cap.studyDays>0 ? Math.ceil(wl.total/(cap.studyDays*(1-sc.bufferPct/100))) : 0;
  return {cls:"bad", short:"Thiếu "+fmtDayMin(wl.total-cap.net), txt:"🔴 Thiếu "+fmtDayMin(wl.total-cap.net)+" — cần khoảng "+pd+" phút/ngày (sau dự phòng) mới kịp."};
}
/* Chia nhỏ theo tuần, tính ngược từ ngày thi; đánh dấu tuần ôn tập & thi thử */
function planWeeks(sc, cap){
  var weeks=[], d=weekDays(0)[0], today=vnToday(), end=cap.exam.date, i=0;
  if(!end) return weeks;
  while(d<end && i<200){
    var a=d<today?today:d, b=addDaysStr(d,6);
    if(b>=end) b=addDaysStr(end,-1);
    var days = a<=b ? diffDays(a,b)+1 : 0;
    weeks.push({from:d, to:b, days:days,
      min:Math.round(sc.dailyMin*days*(sc.daysPerWeek/7)*(1-sc.bufferPct/100))});
    d=addDaysStr(d,7); i++;
  }
  var acc=0;
  for(var j=weeks.length-1;j>=0;j--){ acc+=weeks[j].min; weeks[j].review = acc<=cap.buffer && cap.buffer>0; }
  return weeks;
}

}

function toMin(t){ var p=String(t||"0:0").split(":"); return (+p[0])*60+(+p[1]||0); }
function toHM(m){ m=((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }

/* Gợi ý loại việc theo độ dài khung + mức tỉnh táo */
function slotSuggest(start, end, energy){
  var dur = toMin(end)-toMin(start), out=[];
  if(dur<45){ out.push("🃏 Ôn thẻ từ"); out.push("❌ Xem lại câu sai"); }
  else { out.push("📖 Học bài mới"); out.push("📝 Làm đề"); }
  if(energy==="high") out.push("🧠 Học phần khó");
  return out;
}
/* Bung lịch lặp thành các buổi trong [from,to] */
function evOccurs(ev, from, to){
  var out=[], guard=0;
  if(!ev.recur){ if(ev.date>=from && ev.date<=to) out.push({date:ev.date, ev:ev}); return out; }
  var d=ev.date, end=ev.recurEnd||to, step=ev.recur==="daily"?1:7;
  while(d<=to && d<=end && guard<500){
    if(d>=from) out.push({date:d, ev:ev});
    d=addDaysStr(d,step); guard++;
  }
  return out;
}
function evOverlap(s1,e1,s2,e2){ return toMin(s1)<toMin(e2) && toMin(s2)<toMin(e1); }
/* Tìm các buổi trùng với ev (trừ chính nó) */
function findConflicts(ev){
  var from=ev.date, to=ev.recur?addDaysStr(ev.date,120):ev.date;
  if(ev.recurEnd && ev.recurEnd<to) to=ev.recurEnd;
  var mine=evOccurs(ev,from,to), out=[];
  store.events.forEach(function(o){
    if(o.id===ev.id) return;
    var ocs=evOccurs(o,from,to);
    for(var i=0;i<mine.length;i++) for(var j=0;j<ocs.length;j++){
      if(mine[i].date===ocs[j].date && evOverlap(ev.start,ev.end,o.start,o.end)){
        out.push({date:ocs[j].date, title:o.title, kind:o.kind}); break;
      }
    }
  });
  return out;
}

/* ---- Xuất .ics ---- */
function icsText(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function icsDT(d,t){ return d.replace(/-/g,"")+"T"+t.replace(":","")+"00"; }
function exportICS(){
  if(!store.events.length){ toast("Chưa có lịch nào để xuất."); return; }
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//NhipHoc Mini//TKB//VN","CALSCALE:GREGORIAN"];
  store.events.forEach(function(ev){
    L.push("BEGIN:VEVENT","UID:"+ev.id+"@nhiphoc","DTSTAMP:"+icsDT(vnToday(),"00:00"),
      "SUMMARY:"+icsText((EV_KINDS[ev.kind]||EV_KINDS.other).i+" "+ev.title),
      "DTSTART:"+icsDT(ev.date,ev.start),"DTEND:"+icsDT(ev.date,ev.end));
    if(ev.recur==="daily") L.push("RRULE:FREQ=DAILY"+(ev.recurEnd?";UNTIL="+icsDT(ev.recurEnd,"23:59"):""));
    if(ev.recur==="weekly") L.push("RRULE:FREQ=WEEKLY"+(ev.recurEnd?";UNTIL="+icsDT(ev.recurEnd,"23:59"):""));
    if(ev.note) L.push("DESCRIPTION:"+icsText(ev.note));
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  var blob=new Blob([L.join("\r\n")],{type:"text/calendar"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="thoi-khoa-bieu.ics";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },800);
  toast("Đã xuất .ics — nhập vào Google/Apple Calendar để đồng bộ.");
}

var timerMode = "single"; /* single | pomo | free */
var SESS_MODE_ICON = {single:"⏱", pomo:"🍅", free:"🆓", manual:"✍️"};
function sessRowHTML(s){
  var mi = SESS_MODE_ICON[s.mode||"manual"]||"✍️";
  var meta = [];
  if(s.planned>0) meta.push("⏳ dự kiến "+fmtMin(s.planned));
  meta.push("✅ thực tế "+fmtMin(s.minutes));
  if(s.planned>0 && s.minutes>0){
    var dd = Math.round(s.minutes - s.planned);
    meta.push(dd===0?'<span class="ok">= đúng kế hoạch</span>':dd>0?'<span class="ok">+'+dd+'p</span>':'<span class="bad">'+dd+'p</span>');
  }
  if(s.distractions>0) meta.push("😵‍💫 "+s.distractions);
  if(s.pauses>0) meta.push("⏸ "+s.pauses);
  var sub = [subjectBadge(s.subject), s.topic?("📝 "+esc(s.topic)):"", fmtDate(s.date)].filter(Boolean).join(" · ");
  var task = s.taskId? getTask(s.taskId) : null;
  return '<div class="sess-row"><div style="flex:1;min-width:0"><div class="sess-t">'+mi+' '+esc(s.title)+'</div>'
    +'<div class="sess-s">'+sub+(task?(' · 📌 '+esc(task.title)):"")+'</div>'
    +'<div class="sess-meta">'+meta.join(" · ")+(s.interruption?(' · ⚠️ “'+esc(s.interruption)+'”'):"")+'</div></div>'
    +'<div style="display:flex;gap:4px;flex-shrink:0"><button class="icon-btn sm" data-act="edit-session" data-id="'+s.id+'" title="Sửa">✏️</button>'
    +'<button class="icon-btn sm" data-act="del-session" data-id="'+s.id+'" title="Xóa">🗑</button></div></div>';
}
function startTimer(){
  var sel = $("#tm-task"), taskId = sel? sel.value : "";
  var task = taskId? getTask(taskId) : null;
  var subj = $("#tm-subj")? $("#tm-subj").value : (task? task.subject : "Nội trú");
  var topic = $("#tm-topic")? $("#tm-topic").value.trim() : "";
  var base = { running:true, runId:uid(), startedAt:Date.now(), elapsed:0,
    taskId:taskId, title: task? task.title : "Phiên tự do", subject:subj, topic:topic,
    pauses:0, distractions:0, phaseStart:Date.now() };
  if(timerMode==="pomo"){
    var pm = store.settings.pomo = {
      focus: Math.max(5, parseInt($("#pm-focus")?$("#pm-focus").value:25,10)||25),
      short: Math.max(1, parseInt($("#pm-short")?$("#pm-short").value:5,10)||5),
      long: Math.max(5, parseInt($("#pm-long")?$("#pm-long").value:15,10)||15),
      rounds: Math.min(8, Math.max(1, parseInt($("#pm-rounds")?$("#pm-rounds").value:4,10)||4)) };
    base.mode = "pomo"; base.phase = "focus"; base.cycle = 1;
    base.target = pm.focus*60; base.planned = pm.focus;
    toast("🍅 Hiệp 1/"+pm.rounds+": tập trung "+pm.focus+" phút nhé!");
  } else if(timerMode==="free"){
    base.mode = "free"; base.target = 0;
    base.planned = Math.max(1, parseInt($("#tm-planned")?$("#tm-planned").value:30,10)||30);
    toast("Bắt đầu phiên tự do. Cứ học đi, mình đếm cho!");
  } else {
    base.mode = "single";
    base.target = (timerTaskPreset && task ? (task.minutes||25) : timerDur)*60;
    base.planned = Math.round(base.target/60);
    toast("Bắt đầu tập trung. Cố lên nhé!");
  }
  store.timer = base;
  timerTaskPreset = null;
  saveStore(); render();
}
function pomoAdvance(){
  var t = store.timer; if(!t) return;
  var pm = store.settings.pomo||{focus:25,short:5,long:15,rounds:4};
  if(t.phase==="focus"){
    addSession({ title:t.title, subject:t.subject, topic:t.topic||"", taskId:t.taskId||"",
      date:vnToday(), minutes:Math.round(t.target/60), planned:pm.focus||25, mode:"pomo",
      pauses:t.pauses||0, distractions:t.distractions||0,
      startedAt:t.phaseStart||t.startedAt||Date.now(), endedAt:Date.now() });
    if(t.cycle >= (pm.rounds||4)){
      t.phase="long"; t.target=(pm.long||15)*60;
      toast("🎉 Xong "+(pm.rounds||4)+" hiệp! Nghỉ dài "+(pm.long||15)+" phút nhé.");
    } else {
      t.phase="short"; t.target=(pm.short||5)*60;
      toast("Hết giờ tập trung — nghỉ "+(pm.short||5)+" phút, uống nước nhé!");
    }
  } else {
    if(t.phase==="long"){ store.timer=null; saveStore(); render(); toast("Hoàn thành chu trình Pomodoro! 🌳"); return; }
    t.cycle=(t.cycle||1)+1; t.phase="focus"; t.target=(pm.focus||25)*60;
    toast("🍅 Hiệp "+t.cycle+"/"+(pm.rounds||4)+": tập trung nào!");
  }
  t.elapsed=0; t.startedAt=Date.now(); t.running=true;
  t.pauses=0; t.distractions=0; t.phaseStart=Date.now();
  saveStore(); render();
}
function pauseTimer(){
  var t = timerState(); if(!t.runId || !t.running) return;
  t.elapsed = timerElapsed(); t.running = false; t.startedAt = 0;
  t.pauses = (t.pauses||0)+1;
  store.timer = t; saveStore(); render();
}
function distractTimer(){
  var t = timerState(); if(!t.runId) return;
  t.distractions = (t.distractions||0)+1;
  store.timer = t; saveStore();
  toast("Đã đánh dấu phân tâm lần "+t.distractions+". Quay lại nhé, bạn làm được!");
  if(currentView==="timer") render();
}
function finishTimer(){
  var t = timerState(); if(!t.runId) return;
  if(t.mode==="pomo" && t.phase!=="focus"){
    store.timer = null; saveStore(); render(); toast("Đã bỏ qua giờ nghỉ."); return;
  }
  openFinishModal();
}
/* Hết giờ tự động (đếm ngược) → lưu thẳng, không hỏi */
function autoFinishTimer(){
  var t = timerState(); if(!t.runId) return;
  if(t.mode==="pomo"){ pomoAdvance(); return; }
  var mins = Math.max(1, Math.round(t.target/60));
  addSession({ title:t.title, subject:t.subject, topic:t.topic||"", taskId:t.taskId||"",
    date:vnToday(), minutes:mins, planned:t.planned||mins, mode:t.mode||"single",
    pauses:t.pauses||0, distractions:t.distractions||0,
    startedAt:t.startedAt||Date.now(), endedAt:Date.now() });
  if(t.taskId){ var task = getTask(t.taskId);
    if(task && !task.done && confirm("Đánh dấu việc \""+task.title+"\" đã hoàn thành?")){ task.done = true; } }
  store.timer = null; saveStore();
  toast("Hết giờ! Đã lưu phiên "+fmtMin(mins)+".");
  if(currentView==="timer") render();
}

    + '<div class="field"><span>⚠️ Nguyên nhân gián đoạn (nếu có)</span><input id="fm-int" maxlength="120" placeholder="VD: điện thoại, khách đến..."></div>'

      date:vnToday(), minutes:mins, planned:t.planned||0, mode:t.mode||"single",
      pauses:t.pauses||0, distractions:t.distractions||0, interruption:$("#fm-int").value.trim(),
      startedAt:t.startedAt||Date.now(), endedAt:Date.now() });
    var task = t.taskId? getTask(t.taskId) : null;
    store.timer = null; saveStore(); closeModal();
    if(task && !task.done && confirm("Đánh dấu việc \""+task.title+"\" đã hoàn thành?")){ task.done = true; saveStore(); }
    toast("Đã lưu phiên "+fmtMin(mins)+". Nghỉ một chút nhé!");
    if(currentView==="timer") render();
  };
  setTimeout(function(){ var f=$("#fm-min"); if(f){ f.focus(); f.select(); } },80);

function toggleTimerFull(){
  var on = document.body.classList.toggle("tfull");
  var b = $("#tm-full"); if(b) b.textContent = on ? "⛶ Thu nhỏ" : "⛶ Toàn màn hình";
  try{
    if(on && document.documentElement.requestFullscreen){
      var p = document.documentElement.requestFullscreen();
      if(p && p.catch) p.catch(function(){});
    } else if(!on && document.exitFullscreen && document.fullscreenElement){
      var q = document.exitFullscreen();
      if(q && q.catch) q.catch(function(){});
    }
  }catch(e){}
}
document.addEventListener("fullscreenchange", function(){
  if(!document.fullscreenElement && document.body.classList.contains("tfull")){
    document.body.classList.remove("tfull");
    var b = $("#tm-full"); if(b) b.textContent = "⛶ Toàn màn hình";
  }
});
function ensureTick(){
  if(tickInt) return;
  tickInt = setInterval(function(){
    var t = store.timer;
    if(t && t.runId && t.running){
      if(t.target>0 && timerElapsed() >= t.target){
        if(t.mode==="pomo"){ pomoAdvance(); }
        else { autoFinishTimer(); }
        return;
      }
      if(currentView==="timer"){
        var el = $(".timer-time");
        if(el){ var r = t.target>0 ? Math.max(0, t.target - timerElapsed()) : timerElapsed(); el.textContent = pad(Math.floor(r/60))+":"+pad(r%60); }
        var fg = $(".ring .fg");
        if(fg && t.target>0){ var C = 2*Math.PI*100; var f = Math.min(1, timerElapsed()/t.target); fg.setAttribute("stroke-dashoffset", (C*(1-f)).toFixed(1)); }
      }
    }
  }, 1000);
}

}
function metricsHTML(){
  var today=vnToday(), d14=[], dPrev=[];
  for(var i=13;i>=0;i--) d14.push(addDaysStr(today,-i));

  return '<div class="card" style="margin-bottom:18px"><h2>📊 Chỉ số học tập</h2>'

    +mcard("⏱","Thời gian","Bạn đang dành nguồn lực vào đâu",b1)
