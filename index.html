/* ============ Sao lưu vào MacBook: quyền theo từng website ============ */
var backupPermState = 'unknown';
var backupTimerOn = false;
var BK = {dir:null, meta:{}, ready:null, busy:false, error:'', warning:''};
var BK_INTERVAL = 24 * 60 * 60 * 1000;
var BK_KEEP = 7;
var BK_DB = NH_SCOPE === 'file:' ? 'nhiphoc-backup' : 'nhiphoc-backup:' + NH_SCOPE;
function backupSupported(){
  return window.isSecureContext !== false && typeof window.showDirectoryPicker === 'function' && typeof indexedDB !== 'undefined';
}
function bkIdb(){
  return new Promise(function(resolve,reject){
    var request = indexedDB.open(BK_DB,1);
    request.onupgradeneeded = function(){ if(!request.result.objectStoreNames.contains('h')) request.result.createObjectStore('h'); };
    request.onsuccess = function(){ resolve(request.result); };
    request.onerror = function(){ reject(request.error || new Error('Không mở được nơi lưu quyền thư mục.')); };
    request.onblocked = function(){ reject(new Error('Đóng các tab Nhịp Học cũ rồi thử lại.')); };
  });
}
function bkTransaction(key,value,write){
  return bkIdb().then(function(db){
    return new Promise(function(resolve,reject){
      try{
        var tx = db.transaction('h',write?'readwrite':'readonly');
        var req = write ? tx.objectStore('h').put(value,key) : tx.objectStore('h').get(key);
        tx.oncomplete = function(){ var result = req.result; db.close(); resolve(write?undefined:(result===undefined?null:result)); };
        tx.onerror = tx.onabort = function(){ db.close(); reject(tx.error || req.error || new Error('Không lưu được quyền thư mục.')); };
      }catch(error){ db.close(); reject(error); }
    });
  });
}
function bkIdbSet(key,value){ return bkTransaction(key,value,true); }
function bkIdbGet(key){ return bkTransaction(key,null,false); }
function bkIdbLink(dir,meta){
  // A folder and its scheduling metadata must change together.
  return bkIdb().then(function(db){return new Promise(function(resolve,reject){
    try{
      var tx=db.transaction('h','readwrite'), objectStore=tx.objectStore('h');
      objectStore.put(dir,'dir'); objectStore.put(meta,'meta');
      tx.oncomplete=function(){db.close();resolve();};
      tx.onerror=tx.onabort=function(){db.close();reject(tx.error||new Error('Không lưu được liên kết thư mục.'));};
    }catch(error){db.close();reject(error);}
  });});
}
function bkPaint(){
  $all('.nh-backup-panel').forEach(function(panel){ panel.innerHTML = bkPanelHTML(); });
}
function bkSetPerm(state){ backupPermState=state; bkPaint(); }
async function refreshBackupPerm(){
  if(!backupSupported()){ bkSetPerm('unsupported'); return; }
  if(!BK.ready){
    BK.ready = Promise.all([bkIdbGet('dir'),bkIdbGet('meta')]).then(function(values){
      BK.dir=values[0]; BK.meta=values[1]||{};
    }).catch(function(error){ BK.error=error.message; BK.ready=null; throw error; });
  }
  try{
    await BK.ready;
    if(!BK.dir){ bkSetPerm('nolink'); return; }
    var permission = await BK.dir.queryPermission({mode:'readwrite'});
    bkSetPerm(permission==='granted'?'ok':'noperm');
  }catch(error){ BK.error=error.message; bkSetPerm('error'); }
}
function bkWriterId(){
  if(globalThis.crypto && typeof crypto.getRandomValues==='function'){
    return 'nh'+Array.from(crypto.getRandomValues(new Uint8Array(6)),function(n){return n.toString(16).padStart(2,'0');}).join('');
  }
  return 'nh'+(Date.now().toString(16)+Math.random().toString(16).slice(2)).slice(-12);
}
function backupStamp(date){
  return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate())+'-'+pad(date.getHours())+pad(date.getMinutes())+pad(date.getSeconds())+'-'+String(date.getMilliseconds()).padStart(3,'0');
}
async function pruneOldBackups(dir,keepName){
  /* Only prune this link's own files; never remove legacy or unrelated JSON. */
  if(!/^nh[0-9a-f]{12}$/.test(BK.meta.writerId||'')) return;
  var pattern=new RegExp('^nhip-hoc-backup-\\d{4}-\\d{2}-\\d{2}-\\d{6}-\\d{3}-'+BK.meta.writerId+'-[a-z0-9]+\\.json$');
  var names=[];
  for await (var entry of dir.values()) if(entry.kind==='file' && pattern.test(entry.name)) names.push(entry.name);
  names.sort().reverse();
  var retained=new Set([keepName]);
  names.forEach(function(name){ if(retained.size<BK_KEEP) retained.add(name); });
  for(var name of names) if(!retained.has(name)) await dir.removeEntry(name);
}
async function writeBackupFile(dir){
  var writerId=BK.meta.writerId || bkWriterId();
  var name='nhip-hoc-backup-'+backupStamp(new Date())+'-'+writerId+'-'+uid().replace(/-/g,'')+'.json';
  var snapshot=uPayload();
  snapshot.backupInfo={format:1,writerId:writerId};
  var payload=JSON.stringify(snapshot,null,2), writable=null;
  try{
    var fileHandle=await dir.getFileHandle(name,{create:true});
    writable=await fileHandle.createWritable();
    await writable.write(payload);
    await writable.close(); writable=null;
    var written=await fileHandle.getFile();
    if(await written.text()!==payload) throw new Error('Nội dung file sau khi ghi không khớp.');
  }catch(error){
    if(writable && typeof writable.abort==='function') try{ await writable.abort(); }catch(_){}
    throw error;
  }
  BK.meta=Object.assign({},BK.meta,{writerId:writerId,lastSuccess:Date.now(),lastFile:name,dirName:dir.name||BK.meta.dirName||''});
  BK.warning='';
  try{ await bkIdbSet('meta',BK.meta); }
  catch(_){ BK.warning='Đã ghi file, nhưng chưa lưu được mốc thời gian trên trình duyệt.'; }
  try{ await pruneOldBackups(dir,name); }
  catch(_){ BK.warning+=' Đã ghi file mới; chưa dọn được các bản cũ.'; }
  return name;
}
async function getBackupDir(){
  await refreshBackupPerm();
  return backupPermState==='ok'?BK.dir:null;
}
async function bkRun(manual){
  var dir=await getBackupDir();
  if(!dir){ if(manual) toast('Chọn thư mục hoặc bấm Cấp lại quyền ghi trước khi sao lưu.'); return backupPermState; }
  if(U.loadError || U.saveError || U.conflict){
    if(manual) toast('Cần xử lý lỗi lưu dữ liệu trước. Hãy xuất JSON của bản đang mở để giữ thay đổi.');
    return 'blocked';
  }
  /* Another tab may have just completed the scheduled backup. */
  var saved=await bkIdbGet('meta');
  if(saved && saved.writerId===BK.meta.writerId) BK.meta=saved;
  if(!manual && Date.now()-(BK.meta.lastSuccess||0)<BK_INTERVAL) return 'wait';
  var name=await writeBackupFile(dir);
  BK.error=''; bkSetPerm('ok');
  if(manual) toast('Đã ghi và kiểm tra file sao lưu trên máy.');
  return name;
}
async function autoBackup(manual){
  if(!backupSupported()) return 'unsupported';
  if(BK.busy) return 'busy';
  BK.busy=true; bkPaint();
  try{
    if(navigator.locks && typeof navigator.locks.request==='function'){
      return await navigator.locks.request('nhip-hoc-backup:'+NH_SCOPE,{ifAvailable:true},function(lock){return lock?bkRun(!!manual):'busy';});
    }
    return await bkRun(!!manual);
  }catch(error){
    BK.error=error.name==='NotAllowedError'?'Quyền ghi đã hết hiệu lực. Bấm Cấp lại quyền ghi.':(error.message||'Không ghi được file; kiểm tra thư mục và dung lượng đĩa.');
    if(error.name==='NotAllowedError') backupPermState='noperm';
    if(manual) toast('Sao lưu chưa thành công. '+BK.error);
    return 'error';
  }finally{ BK.busy=false; bkPaint(); }
}
function startBackupTimer(){
  if(backupTimerOn) return;
  backupTimerOn=true;
  var check=function(){if(!document.hidden) autoBackup(false);};
  setInterval(check,60*1000);
  document.addEventListener('visibilitychange',check);
  window.addEventListener('pageshow',check);
  window.addEventListener('focus',check);
}
function backupLink(){
  if(BK.busy) return;
  if(!backupSupported()){ toast('Dùng Chrome hoặc Edge trên MacBook để liên kết thư mục. Bạn vẫn có thể xuất JSON thủ công.'); return; }
  /* Invoke the picker in the click itself, before any asynchronous work. */
  var picker;
  try{ picker=window.showDirectoryPicker({id:'nhip-hoc-backup',mode:'readwrite',startIn:'documents'}); }
  catch(error){ toast('Không mở được hộp chọn thư mục. '+error.message); return; }
  BK.busy=true; bkPaint();
  return picker.then(async function(handle){
    var same=BK.dir && typeof handle.isSameEntry==='function' && await handle.isSameEntry(BK.dir);
    var meta=same?Object.assign({},BK.meta):{writerId:bkWriterId(),lastSuccess:0,lastFile:''};
    meta.dirName=handle.name||'';
    await bkIdbLink(handle,meta);
    BK.dir=handle; BK.meta=meta; BK.ready=Promise.resolve(); BK.error='';
    await refreshBackupPerm();
    BK.busy=false;
    if(backupPermState==='ok') return autoBackup(true);
    toast('Đã chọn thư mục. Bấm Cấp lại quyền ghi để tiếp tục.');
  }).catch(function(error){
    if(error.name!=='AbortError'){BK.error=error.message;toast('Chưa liên kết được thư mục. Hãy thử lại.');}
  }).finally(function(){BK.busy=false;bkPaint();});
}
async function backupUnlink(){
  if(BK.busy || !confirm('Hủy liên kết thư mục? Các file sao lưu đã có vẫn được giữ.')) return;
  BK.busy=true;
  try{
    await bkIdbLink(null,null);
    BK.dir=null; BK.meta={}; BK.error=''; BK.warning=''; BK.ready=Promise.resolve(); bkSetPerm('nolink');
    toast('Đã hủy liên kết. Các file trên máy vẫn còn.');
  }catch(error){BK.error=error.message;toast('Chưa hủy được liên kết. Hãy thử lại.');}
  finally{BK.busy=false;bkPaint();}
}
function backupGrant(){
  if(BK.busy) return;
  if(!BK.dir){ toast('Bấm Chọn thư mục trên MacBook để liên kết lại.'); return; }
  /* The handle is cached so requestPermission keeps the button's user gesture. */
  var permission;
  try{permission=BK.dir.requestPermission({mode:'readwrite'});}
  catch(error){toast('Không xin được quyền. Hãy chọn lại thư mục.');return;}
  return permission.then(function(state){
    bkSetPerm(state==='granted'?'ok':'noperm');
    if(state==='granted'){BK.error='';return autoBackup(true);}
    toast('Chưa được cấp quyền ghi. Bạn có thể xuất JSON thủ công.');
  }).catch(function(){toast('Không xin được quyền. Hãy chọn lại thư mục.');});
}

function fcGet(id){ for(var i=0;i<store.folders.length;i++) if(store.folders[i].id===id) return store.folders[i]; return null; }
function fcGetCard(id){ for(var i=0;i<store.cards.length;i++) if(store.cards[i].id===id) return store.cards[i]; return null; }
function fcChildren(pid){ return store.folders.filter(function(f){ return (f.parentId||"")===(pid||""); }); }
function fcDepth(id){ var d=1, f=fcGet(id); while(f && f.parentId){ d++; f=fcGet(f.parentId); } return d; }
function fcDescIds(id){ var ids=[id]; fcChildren(id).forEach(function(c){ ids = ids.concat(fcDescIds(c.id)); }); return ids; }
function fcPath(id){ var p=[], f=fcGet(id); while(f){ p.unshift(f); f = f.parentId? fcGet(f.parentId) : null; } return p; }
function fcCount(fid){ var ids = fcDescIds(fid); return store.cards.filter(function(c){ return ids.indexOf(c.folderId)>=0; }).length; }
/* ---- Tags, trạng thái, SRS nhẹ ---- */
function fcTagsOf(c){
  return String(c.tags||"").split(/[\s,]+/).map(function(t){return t.trim().replace(/^#+/,"").toLowerCase();}).filter(Boolean);
}
function fcAllTags(){
  var s={}; store.cards.forEach(function(c){ fcTagsOf(c).forEach(function(t){ s[t]=1; }); });
  return Object.keys(s).sort();
}
function fcFiltered(){
  var ids = fcFolder==="all" ? null : (fcFolder==="uncat" ? [""] : fcDescIds(fcFolder));
  var q = fcSearch.trim().toLowerCase(), today = vnToday();
  return store.cards.filter(function(c){
    if(ids && ids.indexOf(c.folderId||"")<0) return false;
    if(fcTags.length && !fcTags.some(function(t){ return fcTagsOf(c).indexOf(t)>=0; })) return false;
    if(fcStatus==="due"){ if(!(c.due && c.due<=today)) return false; }
    else if(fcStatus==="new"){ if((c.reps||0)>0) return false; }
    else if(fcStatus==="flag"){ if(!c.flag) return false; }
    if(q){ var hay = ((c.name||"")+" "+(c.front||"")+" "+(c.back||"")+" "+(c.tags||"")+" "+(c.subject||"")).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function fcStatusCounts(){
  var ids = fcFolder==="all" ? null : (fcFolder==="uncat" ? [""] : fcDescIds(fcFolder));
  var q = fcSearch.trim().toLowerCase(), today = vnToday();
  var base = store.cards.filter(function(c){
    if(ids && ids.indexOf(c.folderId||"")<0) return false;
    if(fcTags.length && !fcTags.some(function(t){ return fcTagsOf(c).indexOf(t)>=0; })) return false;
    if(q){ var hay = ((c.name||"")+" "+(c.front||"")+" "+(c.back||"")+" "+(c.tags||"")).toLowerCase(); if(hay.indexOf(q)<0) return false; }
    return true;
  });
  return {
    all: base.length,
    due: base.filter(function(c){return c.due && c.due<=today;}).length,
    new: base.filter(function(c){return !(c.reps>0);}).length,
    flag: base.filter(function(c){return c.flag;}).length
  };
}
function fcScopeCards(){
  var ids = null;
  if(fcScopeFolders.length){
    ids = [];
    fcScopeFolders.forEach(function(fid){
      if(fid==="uncat") ids.push("");
      else ids = ids.concat(fcDescIds(fid));
    });
  }
  return store.cards.filter(function(c){
    if(ids && ids.indexOf(c.folderId||"")<0) return false;
    if(fcScopeTags.length && !fcScopeTags.some(function(t){ return fcTagsOf(c).indexOf(t)>=0; })) return false;
    return true;
  });
}
function fcBuildQueue(){
  var pool = fcScopeCards(), today = vnToday();
  var due = pool.filter(function(c){return c.due && c.due<=today;})
    .sort(function(a,b){return String(a.due).localeCompare(String(b.due));});
  var fresh = pool.filter(function(c){return !(c.reps>0);});
  if(fcReviewType==="due") return due.concat(fresh.slice(0, store.settings.newPerDay||20));
  if(fcReviewType==="new") return fresh;
  if(fcReviewType==="flag") return pool.filter(function(c){return c.flag;});
  if(fcReviewType==="lapse") return pool.filter(function(c){return (c.lapses||0)>=2;})
    .sort(function(a,b){return (b.lapses||0)-(a.lapses||0);});
  if(fcReviewType==="recent") return pool.filter(function(c){return c.lastReview===today;});
  if(fcReviewType==="shuffle"){
    var all = pool.slice();
    for(var i=all.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=all[i]; all[i]=all[j]; all[j]=t; }
    return all;
  }
  var rest = pool.filter(function(c){return !(c.due && c.due<=today) && c.reps>0;});
  return due.concat(fresh).concat(rest);
}
function fcReviewStreak(){
  var days={}; store.cards.forEach(function(c){ if(c.lastReview) days[c.lastReview]=1; });
  var s=0, d=vnToday(); if(!days[d]) d=addDaysStr(d,-1);

}

}

/* Tỷ lệ nhớ + phân bổ nút chấm trong 30 ngày (kiểu Anki stats) */
function fcRetentionStats(){
  var cutoff = addDaysStr(vnToday(), -30);
  var n = {again:0, hard:0, good:0, easy:0};
  store.cards.forEach(function(c){
    (c.log||[]).forEach(function(e){ if(e.d>=cutoff && n[e.r]!=null) n[e.r]++; });
  });
  var tot = n.again+n.hard+n.good+n.easy;
  return { n:n, tot:tot, ret: tot? Math.round(100*(n.good+n.easy)/tot) : null };
}
function fcRetentionCardHTML(){
  var r = fcRetentionStats();
  var h = '<div class="card"><h2>📊 Chất lượng ôn tập (30 ngày)</h2>';
  if(!r.tot){ h += '<p class="sub">Chưa có lượt chấm nào. Ôn thẻ để xem tỷ lệ nhớ của bạn.</p></div>'; return h; }
  var rows = [["again","✗ Quên","var(--red)"],["hard","😅 Khó","var(--amber)"],["good","👍 Được","var(--purple)"],["easy","🌟 Dễ","var(--green)"]];
  h += '<p class="sub">Tỷ lệ nhớ: <strong style="font-size:20px;color:var(--text)">'+r.ret+'%</strong> · '+r.tot+' lượt chấm</p>';
  rows.forEach(function(x){
    var p = Math.round(100*r.n[x[0]]/r.tot);
    h += '<div class="prow"><span class="nm">'+x[1]+'</span><span class="barwrap"><i style="width:'+p+'%;background:'+x[2]+'"></i></span>'
      + '<span class="num">'+r.n[x[0]]+' lượt ('+p+'%)</span></div>';
  });
  h += '<p class="sub" style="margin:10px 0 0">💡 Mẹo kiểu Anki: tỷ lệ nhớ 85–92% là vùng tối ưu — thấp hơn nghĩa là bạn đang nhồi quá nhiều thẻ mới, cao hơn nghĩa là có thể tăng tốc.</p></div>';

  var mx = Math.max.apply(null, days.map(function(d){return map[d];}).concat([1]));

  } else {

        + '<div class="task-meta"><span>'+(FC_QTYPE_NAMES[r.qtype]||"Ôn thẻ")+'</span>'
        + '<span>'+r.cards+' thẻ</span><span>'+r.graded+' lượt chấm</span><span>⏱ '+fmtMin(mins)+'</span>'
        + '<span>✗ '+(r.grades.again||0)+' · 😅 '+(r.grades.hard||0)+' · 👍 '+(r.grades.good||0)+' · 🌟 '+(r.grades.easy||0)+'</span>'
        + (r.done? "" : '<span class="badge min">dở dang</span>') + '</div></div>'
        + '<span class="prio '+(ret>=85?"p3":ret>=60?"p2":"p1")+'" style="font-size:13px;flex-shrink:0">'+ret+'% nhớ</span></div>';
    }).join("") + "</div>";
  }

function fcParseCSV(text){
  var rows=[],row=[],cur="",inQ=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
    else if(ch==='"') inQ=true;
    else if(ch===","){ row.push(cur); cur=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cur); cur="";
      if(row.length>1||row[0].trim()) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if(row.length>1||row[0].trim()) rows.push(row);
  if(rows.length && /^"?front"?$/i.test(rows[0][0].trim())) rows.shift();
  return rows;
}
function fcEnsureFolderPath(path){
  if(!String(path||"").trim()) return "";
  var parts=String(path).split(">").map(function(s){return s.trim();}).filter(Boolean), pid="";
  parts.slice(0,4).forEach(function(name){
    var ex=fcChildren(pid).filter(function(f){return f.title===name;})[0];
    if(ex) pid=ex.id;
    else { var nf={id:uid(),title:name.slice(0,80),parentId:pid}; store.folders.push(nf); pid=nf.id; }
  });
  return pid;
}

function fcImportFile(kind){
  var inp=$("#io-file");
  inp.setAttribute("accept", kind==="json" ? ".json,application/json" : ".csv,.txt,text/csv");
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        if(kind==="json"){
          var d=JSON.parse(r.result);
          if(!d||!Array.isArray(d.cards)) throw 0;
          if(confirm("Nhập "+d.cards.length+" thẻ? Thẻ hiện tại được giữ lại.")){
            d.cards.forEach(function(c){ c.id=uid(); c.createdAt=Date.now(); store.cards.push(c); });
            if(Array.isArray(d.folders)) d.folders.forEach(function(f){
              if(!fcGet(f.id)) store.folders.push(f); });
            saveStore(); closeModal(); render(); toast("Đã nhập "+d.cards.length+" thẻ.");
          }
        } else {
          var rows=fcParseCSV(r.result), n=0;
          rows.forEach(function(row){
            if(row.length<2||!row[0].trim()) return;
            store.cards.push({id:uid(),front:row[0].trim(),back:(row[1]||"").trim(),
              name:(row[2]||"").trim(),tags:(row[3]||"").trim(),
              subject:(row[4]||"Nội trú").trim()||"Nội trú",type:"standard",
              folderId:fcEnsureFolderPath(row[5]||""),imgF:"",imgB:"",src:"",occl:[],
              reps:0,due:null,flag:false,createdAt:Date.now()});
            n++;
          });
          saveStore(); closeModal(); render(); toast("Đã nhập "+n+" thẻ từ CSV.");
        }
      }catch(e){ toast("File không đúng định dạng."); }
      inp.value="";
    };
    r.readAsText(f);
  };
  inp.click();
}

/* Markdown siêu nhẹ: **đậm**, [...điền khuyết...], [[id|tên]] liên kết thẻ, xuống dòng */
function mdLite(src, opts){
  opts = opts||{};
  var s = esc(src||"");
  if(opts.cloze==="hide") s = s.replace(/\[([^\]]*)\]/g, '<span class="cloze-blank">…</span>');
  else if(opts.cloze==="show") s = s.replace(/\[([^\]]*)\]/g, '<span class="cloze-show">$1</span>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/\[\[([^\]|]+)\|([^\]]*)\]\]/g, function(m,id,name){
    var c = fcGetCard(id);
    return '<span class="linkchip">🔗 '+esc(c ? (c.name||c.front||"thẻ") : (name||"thẻ"))+'</span>';
  });
  s = s.replace(/\[\[([^\]]+)\]\]/g, function(m,id){
    var c = fcGetCard(id);
    return '<span class="linkchip">🔗 '+esc(c ? (c.name||c.front||"thẻ") : id)+'</span>';
  });
  return s.replace(/\n/g,"<br>");
}

/* Đọc ảnh từ máy, tùy chọn thu nhỏ còn ≤2000px */
function fcReadImage(file, optimize, cb){
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(optimize && Math.max(w,h) > 2000){ var k = 2000/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      try{
        var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        var url = null;
        try{ url = cv.toDataURL("image/webp", .82); }catch(e){}
        if(!url || url.indexOf("data:image/webp")!==0){ try{ url = cv.toDataURL("image/jpeg", .82); }catch(e2){ url = null; } }
        cb(url || r.result);
      }catch(err){ cb(r.result); }
    };
    img.onerror = function(){ cb(r.result); };
    img.src = r.result;
  };
  r.onerror = function(){ toast("Không đọc được ảnh."); };
  r.readAsDataURL(file);
}

  function fcOcclInit(){
    var cv = $("#fc-occl-canvas"); if(!cv || !imgF) return;
    var img = new Image();
    img.onload = function(){
      var k = Math.min(1, 640/img.width);
      cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
      var ctx = cv.getContext("2d"), drawing = null;
      function draw(temp){
        ctx.clearRect(0,0,cv.width,cv.height);
        ctx.drawImage(img,0,0,cv.width,cv.height);
        var all = occl.concat(temp?[temp]:[]);
        all.forEach(function(b,i){
          var x=b.x*cv.width, y=b.y*cv.height, w=b.w*cv.width, h=b.h*cv.height;
          ctx.fillStyle = i<occl.length ? "rgba(24,18,48,.92)" : "rgba(139,123,216,.45)";
          ctx.strokeStyle = "#a68cf0"; ctx.lineWidth = 2;
          if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,6); ctx.fill(); ctx.stroke(); }
          else { ctx.fillRect(x,y,w,h); ctx.strokeRect(x,y,w,h); }
          ctx.fillStyle = "#fff"; ctx.font = "bold 13px sans-serif";
          ctx.fillText(String(i+1), x+8, y+18);
        });
      }
      function pos(e){
        var r = cv.getBoundingClientRect();
        var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
        return { x:(p.clientX-r.left)/r.width, y:(p.clientY-r.top)/r.height };
      }
      cv.onpointerdown = function(e){ e.preventDefault(); var p=pos(e); drawing={x:p.x,y:p.y,w:0,h:0};
        try{ cv.setPointerCapture(e.pointerId); }catch(err){} };
      cv.onpointermove = function(e){ if(!drawing) return; var p=pos(e);
        drawing.w=p.x-drawing.x; drawing.h=p.y-drawing.y; draw(drawing); };
      cv.onpointerup = function(e){ if(!drawing) return; var p=pos(e);
        var x=Math.min(drawing.x,p.x), y=Math.min(drawing.y,p.y);
        var w=Math.abs(p.x-drawing.x), h=Math.abs(p.y-drawing.y);
        drawing = null;
        if(w>0.02 && h>0.02) occl.push({x:x,y:y,w:w,h:h});
        draw(); };
      draw();
    };
    img.src = imgF;
  }

var GRADE_NAMES = {again:"Quên", hard:"Khó", good:"Được", easy:"Dễ"};
/* Khoảng lặp lại tiếp theo theo kiểu Anki (SM-2 rút gọn) */
function fcNextInterval(c, grade){
  var ease = c.ease || 2.3, reps = c.reps||0, iv = c.interval||0;
  if(grade==="again") return 0;
  if(grade==="hard") return Math.max(1, Math.round((iv||1)*1.2));
  if(grade==="easy") return Math.max(4, Math.round((iv||1)*ease*1.4));
  if(reps===0) return 1;
  if(reps===1) return 3;
  return Math.max(3, Math.round(iv*ease));
}
function fcGradeLabel(c, grade){
  var n = fcNextInterval(c, grade);
  if(grade==="again") return "<10 phút";
  return n+" ngày";
}
function fcGradeButtonsHTML(c){
  var g = [["again","✗ Quên","g-again"],["hard","😅 Khó","g-hard"],["good","👍 Được","g-good"],["easy","🌟 Dễ","g-easy"]];
  return '<div class="grade-row">' + g.map(function(x,i){
    return '<button class="grade-btn '+x[2]+'" data-act="fc-grade" data-v="'+x[0]+'">'+x[1]
      +'<small>'+fcGradeLabel(c,x[0])+' · phím '+(i+1)+'</small></button>';
  }).join("") + "</div>";
}

/* Lưu kết quả một lượt làm bài */
function fcSaveSession(s){
  if(!s || s.saved) return;
  var graded = s.known + s.unknown;
  if(graded<=0) return;
  s.saved = true;
  var uniq = {};
  s.ids.forEach(function(id){ uniq[id]=1; });
  store.fcSessions.push({ id:uid(), date:vnToday(), tsStart:s.tsStart||Date.now(), tsEnd:Date.now(),
    cards:Object.keys(uniq).length, graded:graded,
    grades:{again:s.grades.again||0, hard:s.grades.hard||0, good:s.grades.good||0, easy:s.grades.easy||0},
    qtype:s.qtype||"due", done:!!s.done });
  if(store.fcSessions.length>300) store.fcSessions = store.fcSessions.slice(-300);
  saveStore();
}
function fcSessionRetention(r){
  var g = r.graded||0;
  return g? Math.round(100*((r.grades.good||0)+(r.grades.easy||0))/g) : 0;
}
/* Câu hỏi dạng text thuần để hiển thị trong danh sách */
function fcPlainText(c){
  var t = String(c.front||"");
  t = t.replace(/\[\[([^\]|]*)\|?([^\]]*)\]\]/g, function(m,id,name){ return name||"liên kết"; });
  t = t.replace(/\[([^\]]*)\]/g, "…");
  t = t.replace(/\*\*([^*]*)\*\*/g, "$1");
  return t.replace(/\s+/g," ").trim() || "(thẻ hình ảnh)";
}
function fcGrade(grade){
  if(!fcStudy || fcStudy.done) return;
  var s = fcStudy, c = fcGetCard(s.ids[s.idx]);
  var today = vnToday();
  if(c){
    s.undo = { id:c.id, idx:s.idx, known:s.known, unknown:s.unknown, grade:grade,
      snap:{ reps:c.reps||0, interval:c.interval||0, due:c.due||null, lapses:c.lapses||0,
             lastReview:c.lastReview||null, ease:c.ease||2.3, logLen:(c.log||[]).length },
      requeuedId:null };
    c.log = c.log||[];
    if(grade==="again"){
      c.lapses=(c.lapses||0)+1; c.reps=0; c.interval=0; c.due=today;
      c.log.push({d:today, r:"again"});
      var pos = Math.min(s.ids.length, s.idx+4);
      s.ids.splice(pos, 0, c.id);
      s.undo.requeuedId = c.id;
    } else {
      c.interval=fcNextInterval(c, grade);
      if(grade==="hard") c.ease = Math.max(1.3, (c.ease||2.3)-0.15);
      if(grade==="easy") c.ease = (c.ease||2.3)+0.15;
      c.reps=(c.reps||0)+1;
      c.due=addDaysStr(today, c.interval);
      c.log.push({d:today, r:grade});
      if(c.log.length>200) c.log = c.log.slice(-200);
    }
    c.lastReview = today;
    saveStore();
  }
  if(grade==="again") s.unknown++; else s.known++;
  s.grades[grade] = (s.grades[grade]||0)+1;
  s.idx++; s.flipped = false;
  if(s.idx >= s.ids.length){ s.done = true; fcSaveSession(s); }
  render();
}
function fcUndo(){
  var s = fcStudy;
  if(!s || !s.undo){ toast("Không có gì để hoàn tác."); return; }
  var u = s.undo, c = fcGetCard(u.id);
  if(c){
    c.reps=u.snap.reps; c.interval=u.snap.interval; c.due=u.snap.due;
    c.lapses=u.snap.lapses; c.lastReview=u.snap.lastReview; c.ease=u.snap.ease;
    c.log=(c.log||[]).slice(0, u.snap.logLen);
    saveStore();
  }
  if(u.requeuedId){
    for(var i=s.ids.length-1;i>u.idx;i--){ if(s.ids[i]===u.requeuedId){ s.ids.splice(i,1); break; } }
  }
  if(u.grade && s.grades) s.grades[u.grade]=Math.max(0,(s.grades[u.grade]||0)-1);
  s.idx=u.idx; s.known=u.known; s.unknown=u.unknown; s.done=false; s.flipped=false;
  s.undo=null;
  render(); toast("Đã hoàn tác lượt chấm.");
}
function fcSpeak(){
  if(!fcStudy) return;
  var c = fcGetCard(fcStudy.ids[fcStudy.idx]); if(!c) return;
  try{
    speechSynthesis.cancel();
    var txt = ((c.front||"")+" . "+(c.back||"")).replace(/\[([^\]]*)\]/g,"$1").slice(0,500);
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(txt) ? "vi-VN" : "en-US";
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }catch(e){ toast("Thiết bị không hỗ trợ đọc thành tiếng."); }
}
document.addEventListener("keydown", function(e){

  else if(e.key>="1"&&e.key<="4"){ if(fcStudy.flipped) fcGrade(["again","hard","good","easy"][+e.key-1]); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); fcUndo(); }
});

function uNoteMarkup(text){var lines=esc(text).split('\n'),out=[],inList=false;lines.forEach(line=>{var list=/^[-*] /.test(line);if(!list&&inList){out.push('</ul>');inList=false;}line=line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');if(/^### /.test(line))out.push('<h3>'+line.slice(4)+'</h3>');else if(/^## /.test(line))out.push('<h2>'+line.slice(3)+'</h2>');else if(/^# /.test(line))out.push('<h1>'+line.slice(2)+'</h1>');else if(list){if(!inList){out.push('<ul>');inList=true;}out.push('<li>'+line.slice(2)+'</li>');}else if(/^&gt; /.test(line))out.push('<blockquote>'+line.slice(5)+'</blockquote>');else out.push(line?'<p>'+line+'</p>':'<br>');});if(inList)out.push('</ul>');return out.join('');}

function uHelp(){openModal(uModalHead('Chào mừng đến với Nhịp Học')+'<div class="u-readme"><p>Không gian học tập cá nhân chạy trên GitHub Pages hoặc trực tiếp từ file HTML. Bản online có thể mở lại khi mất mạng sau khi đã tải xong và bật được bộ nhớ ngoại tuyến. Bản HTML vẫn chạy trực tiếp từ máy.</p><h4>Một nhịp học đơn giản</h4><ol><li><b>Thêm việc:</b> chọn một nhiệm vụ nhỏ trên Hôm nay hoặc Kế hoạch. Dùng Mục tiêu để tổ chức tối đa 4 tầng.</li><li><b>Tập trung:</b> bắt đầu 25 / 45 / 60 phút hoặc chọn Pomodoro. Đồng hồ nhỏ đi cùng bạn khi đổi trang.</li><li><b>Ôn lại:</b> mở Thẻ nhớ, chọn thư mục và bắt đầu. Phím Space lật, 1–4 chấm mức nhớ, Ctrl/⌘ Z hoàn tác.</li><li><b>Viết điều đã hiểu:</b> sổ tay tự lưu, hỗ trợ tiêu đề, chữ đậm, danh sách và tag.</li></ol><h4>Phím tắt</h4><p><kbd>Ctrl / ⌘ K</kbd> tìm toàn bộ · <kbd>N</kbd> thêm việc · <kbd>Esc</kbd> đóng hộp thoại. Khi đang ở Tập trung: <kbd>Space</kbd> tạm dừng / tiếp tục.</p><h4>Chuyển từ bản cũ sang bản mới</h4><p>Trước khi đổi sang GitHub Pages, hãy mở bản offline cũ bằng đúng trình duyệt đang dùng và xuất toàn bộ JSON. Mở địa chỉ web mới, vào <b>Sao lưu → Nhập bản sao lưu → Thay thế toàn bộ dữ liệu</b>. Kiểm tra nhiệm vụ, thẻ, ghi chú, lịch và lộ trình; sau đó chọn lại thư mục sao lưu trên MacBook. Nếu dùng cùng tên file, vị trí và trình duyệt, ứng dụng sẽ thử đọc dữ liệu cũ sẵn có. Mỗi trình duyệt có cách lưu file offline khác nhau nên nên giữ thêm bản JSON.</p><h4>Lưu dữ liệu</h4><p>Dữ liệu được giữ trên trình duyệt này. Xóa dữ liệu web, chế độ riêng tư, di chuyển file hoặc đổi thiết bị có thể làm mất quyền truy cập dữ liệu. Hãy xuất JSON định kỳ. Sao lưu vào thư mục mỗi 24 giờ cần Chrome hoặc Edge trên MacBook và quyền ghi còn hiệu lực. Trang kiểm tra khi đang hoạt động và khi mở lại; không thể ghi file khi đã đóng trình duyệt hoặc máy đang ngủ. Safari vẫn tải JSON thủ công được. Các file sao lưu chứa dữ liệu cá nhân: giữ chúng trên máy, không tải lên kho mã GitHub.</p><p>Ứng dụng không kết nối Drive và không tự đồng bộ giữa các máy. Có thể chuyển dữ liệu bằng JSON; thẻ nhớ có thêm CSV. Định dạng Anki .apkg chưa được hỗ trợ.</p><h4>Đồng hồ & ôn thẻ</h4><p>Thời gian dựa trên mốc thực, giúp hạn chế sai lệch khi đổi tab. Khi mở lại sau một quãng nghỉ dài, phiên Pomodoro chuyển sang bước tiếp theo ở trạng thái tạm dừng để không tự ghi thêm thời gian học. Âm báo chỉ phát khi trình duyệt cho phép. Đọc thẻ cần giọng đọc có sẵn trên thiết bị.</p></div><div class="btn-row">'+uButton('Bắt đầu thôi','close','check','btn btn-primary')+'</div>');}

function uAct(action,id,val){
 if(action.startsWith('go-')){closeModal();go(action.slice(3));return;}
 if(action==='close')closeModal();else if(action==='search')uOpenSearch();else if(action==='settings')uSettings();else if(action==='help')uHelp();else if(action==='more')uMore();else if(action==='backup')uBackupModal();else if(action==='export')exportJSON();else if(action==='import')uImportPick();else if(action==='import-confirm')uApplyImport();else if(action==='restore-before')uRestoreBefore();
 else if(action==='export-raw'){try{fcDownload('nhip-hoc-du-lieu-goc.json',localStorage.getItem(LS_KEY)||'{}','application/json');}catch(_){toast('Không đọc được bộ nhớ trình duyệt.');}}
 else if(action==='task-new')uTaskModal();else if(action==='task-edit')uTaskModal(id);else if(action==='goal-detail'){closeModal();goalDetailModal(id);}else if(action==='task-toggle')uToggleTask(id);
 else if(action==='home-tab'){U.tab=val;render();}else if(action==='focus-preset'){U.focus=Number(val);render();}else if(action==='quick-focus')uQuickFocus();else if(action==='focus-task')uQuickFocus(id);else if(action==='timer-toggle')uPauseResume();
 else if(action==='undo'){if(!U.undo)return;var before=U.undo;U.undo=null;if(uWrite(before,false)){store=before;render();toast('Đã hoàn tác.');}else{U.undo=before;toast('Chưa hoàn tác vì không lưu được.');}}
 else if(action==='bulk-clear'){U.selection.clear();uRenderPlanList();}else if(action==='bulk-all'){U.selection=new Set(U.filtered||[]);uRenderPlanList();}else if(action==='bulk-move')uBulkMove();else if(action==='bulk-done')uCommitUndo('Đã hoàn thành các việc đã chọn.',()=>{store.tasks.slice().forEach(t=>{if(U.selection.has(t.id)&&!t.done){t.done=true;t.gstatus='done';t.completedAt=Date.now();if(t.recur)recurClone(t);}});U.selection.clear();});
 else if(action==='search-pick'){var item=U.searchResults?.[Number(val)];if(item){closeModal();uAct(item.action,item.id);}}
 else if(action==='note-new')uNewNote();else if(action==='note-open'){if(uNoteSaveTimer)uFlushNote();U.noteId=id;U.notePreview=false;closeModal();go('notes');}else if(action==='note-preview'){if(uNoteSaveTimer)uFlushNote();U.notePreview=!U.notePreview;render();}else if(action==='note-pin'){var n=store.notes.find(n=>n.id===U.noteId);if(n){n.pinned=!n.pinned;saveStore();render();}}
 else if(action==='note-export'){if(uNoteSaveTimer)uFlushNote();var n=store.notes.find(n=>n.id===U.noteId);if(n)fcDownload('ghi-chu-'+vnToday()+'.md','# '+n.title+'\n\n'+(n.tags?n.tags+'\n\n':'')+n.body,'text/markdown;charset=utf-8');}
 else if(action==='note-delete'){if(confirm('Xóa ghi chú này? Bạn có thể hoàn tác ngay sau đó.')){uCommitUndo('Đã xóa ghi chú.',()=>{store.notes=store.notes.filter(n=>n.id!==U.noteId);U.noteId='';});}}
 else if(action==='event-open'){closeModal();evModal(id);}else if(action==='card-open'){closeModal();go('cards');fcPreviewModal(id);}else if(action==='card-undo')fcUndo();
 else if(action==='review-now'){closeModal();go('cards');fcScopeFolders=[];fcScopeTags=[];fcReviewType='due';fcStartStudy();}
 else if(action==='review-resume'){var d=store.reviewDraft;if(d&&Array.isArray(d.ids)){fcStudy=uClone(d);fcStudy.ids=fcStudy.ids.filter(id=>!!fcGetCard(id));fcStudy.idx=Math.min(fcStudy.idx,fcStudy.ids.length);if(fcStudy.idx>=fcStudy.ids.length){fcStudy.done=true;fcSaveSession(fcStudy);}uUndoCard=null;render();}}
 else if(action==='review-discard'){if(store.reviewDraft)fcSaveSession(store.reviewDraft);store.reviewDraft=null;saveStore();render();}
}

},true);

 if(modal){
  if(e.key==='Tab'){var focusable=$all('button,input,select,textarea,a[href],[tabindex="0"]',modal).filter(el=>!el.disabled&&el.type!=='hidden'&&el.getClientRects().length);if(!focusable.length){e.preventDefault();modal.focus();}else if(e.shiftKey&&document.activeElement===focusable[0]){e.preventDefault();focusable[focusable.length-1].focus();}else if(!e.shiftKey&&document.activeElement===focusable[focusable.length-1]){e.preventDefault();focusable[0].focus();}}
  if($('#u-global-q')&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();var list=$all('.u-search-result'),ix=list.indexOf(document.activeElement),next=e.key==='ArrowDown'?ix+1:ix-1;if(list.length)list[(next+list.length)%list.length].focus();}
  if($('#u-global-q')&&e.key==='Enter'&&document.activeElement===$('#u-global-q')){e.preventDefault();$all('.u-search-result')[0]?.click();}
  if(!input&&fcStudy){e.stopImmediatePropagation();}return;
 }
 if(input||e.ctrlKey||e.metaKey||e.altKey||fcStudy)return;

 if(e.key===' '&&currentView==='timer'&&store.timer?.runId){e.preventDefault();uPauseResume();}

renderTimer=function(){var values={},fields=['tm-task','tm-subj','tm-topic','tm-planned','pm-focus','pm-short','pm-long','pm-rounds'];fields.forEach(id=>{var el=$('#'+id);if(el)values[id]=el.value;});uTimerRenderBase();if(!store.timer?.runId){fields.forEach(id=>{var el=$('#'+id);if(el&&values[id]!==undefined)el.value=values[id];});if(timerTaskPreset){var task=getTask(timerTaskPreset);if(task){$('#tm-task').value=task.id;$('#tm-subj').value=task.subject;}}var display=$('.timer-time');var seconds=timerMode==='free'?0:timerMode==='pomo'?Number($('#pm-focus')?.value||25)*60:((timerTaskPreset?getTask(timerTaskPreset)?.minutes:0)||timerDur)*60;if(display)display.textContent=pad(Math.floor(seconds/60))+':'+pad(seconds%60);var sel=$('#tm-task');if(sel)sel.onchange=function(){var task=getTask(this.value);if(task)$('#tm-subj').value=task.subject;};}};

/* ============ GitHub Pages · bộ nhớ ngoại tuyến, tách biệt dữ liệu ============ */
var NH_RELEASE='3.0.0';
var NH_SW=null;
function nhCanRestore(){
  try{
    if(!U.conflict && localStorage.getItem(LS_KEY)===U.lastRaw) return true;
    toast('Dữ liệu đã đổi ở tab khác. Xuất bản đang mở rồi tải lại trước khi khôi phục.');
  }catch(_){toast('Không truy cập được bộ nhớ trình duyệt. Hãy xuất JSON và cho phép lưu dữ liệu trước khi khôi phục.');}
  return false;
}
function nhDataEmpty(){return ['tasks','sessions','folders','cards','habits','fcSessions','events','slots','notes'].every(function(k){return !store[k].length;});}
function nhShowUpdate(registration){
  if(!registration.waiting || document.querySelector('#nh-update')) return;
  var notice=document.createElement('div'); notice.id='nh-update'; notice.className='u-notice';
  notice.innerHTML='Nhịp Học có phiên bản mới. '+uButton('Tải bản mới','nh-update',null,'btn btn-sm btn-ghost');
  document.querySelector('.container').prepend(notice);
}
function nhApplyUpdate(){
  if(uNoteSaveTimer) uFlushNote();
  if(U.saveError || U.conflict || U.loadError){toast('Xuất JSON và xử lý lỗi lưu trước khi cập nhật trang.');return;}
  if(store.timer?.runId || fcStudy){toast('Hãy kết thúc phiên tập trung hoặc đóng lượt ôn trước khi cập nhật.');return;}
  if(!saveStore()) return;
  var worker=NH_SW?.waiting;
  if(worker){
    var reloading=false;
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(!reloading){reloading=true;location.reload();}});
    worker.postMessage({type:'SKIP_WAITING'});
  }else location.reload();
}
function nhStartPages(){
  var footer=document.querySelector('.footer');
  if(footer) footer.innerHTML='Nhịp Học · Lưu trên thiết bị <span style="margin:0 8px">·</span> '+uButton('Hướng dẫn & phím tắt','help',null,'u-link')+' <span style="margin:0 8px">·</span> v'+NH_RELEASE;
  if(NH_SCOPE==='file:') return;
  if(!U.lastRaw && !U.loadError && nhDataEmpty()){
    var notice=document.createElement('div');notice.id='nh-migration';notice.className='u-notice';
    notice.innerHTML='<strong>Chuyển từ bản offline?</strong> Mở bản cũ và xuất toàn bộ JSON. Sau đó vào Sao lưu → Nhập bản sao lưu tại đây; chọn Thay thế toàn bộ để chuyển cả cài đặt và lộ trình. Dữ liệu cũ không tự chuyển qua địa chỉ web mới. '+uButton('Mở sao lưu','backup','download','btn btn-sm btn-ghost')+uButton('Đóng thông báo','nh-dismiss',null,'u-link');
    document.querySelector('.container').prepend(notice);
  }
  if(!('serviceWorker' in navigator) || !window.isSecureContext) return;
  navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'}).then(function(registration){
    NH_SW=registration; nhShowUpdate(registration);
    registration.addEventListener('updatefound',function(){
      var worker=registration.installing;
      if(worker) worker.addEventListener('statechange',function(){if(worker.state==='installed' && navigator.serviceWorker.controller) nhShowUpdate(registration);});
    });
    navigator.serviceWorker.ready.then(function(){
      if(footer){var status=document.createElement('span');status.textContent=' · Đã sẵn sàng mở lại khi mất mạng';footer.appendChild(status);}
    });
  }).catch(function(){
    if(footer){var status=document.createElement('span');status.textContent=' · Chưa bật được chế độ ngoại tuyến; hãy giữ bản HTML dự phòng';footer.appendChild(status);}
  });
}
var nhBaseAct=uAct;
uAct=function(action,id,value){
  if(action==='nh-update')return nhApplyUpdate();
  if(action==='nh-dismiss'){document.querySelector('#nh-migration')?.remove();return;}
  return nhBaseAct(action,id,value);
};
